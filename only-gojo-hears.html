<title>Only Gojo Hears</title>
<meta name="description" content="Indie 3D fan animation, part 1. First-person lesson with Satoru Gojo at Jujutsu High, where only he hears the explosions.">
<style>
  /* Layout: one 16:9 screen centred on black, icon-only controls on top of it. A single deliberate cinema look, no words on screen. */
  :root {
    --void: #050608;        /* theatre black around the frame */
    --screen: #000;         /* the frame itself */
    --chalk: #e9eef2;       /* control glyphs, chalk white */
    --six: #7fd3ff;         /* Six Eyes blue, focus + progress */
    --dim: rgba(233, 238, 242, .18);
    color-scheme: dark;
  }
  html, body { height: 100%; background: var(--void); color: var(--chalk); }
  body { margin: 0; display: grid; place-items: center; overflow: hidden; padding-inline: 16px; box-sizing: border-box; }
  .frame { position: relative; width: min(100%, calc((100vh - 32px) * 16 / 9)); max-width: 100%; aspect-ratio: 16 / 9; background: var(--screen); box-shadow: 0 0 0 1px #111, 0 30px 80px rgba(0,0,0,.6); overflow: hidden; }
  .frame:fullscreen { width: 100%; height: 100%; aspect-ratio: auto; box-shadow: none; }
  canvas { display: block; width: 100%; height: 100%; }
  .veil { position: absolute; inset: 0; display: grid; place-items: center; background: radial-gradient(ellipse at center, rgba(0,0,0,.15), rgba(0,0,0,.7)); transition: opacity .6s ease; }
  .veil[data-off="true"] { opacity: 0; pointer-events: none; }
  .big { width: clamp(64px, 11vw, 112px); aspect-ratio: 1; border-radius: 50%; border: 1.5px solid var(--dim); background: rgba(5,6,8,.45); color: var(--chalk); display: grid; place-items: center; cursor: pointer; padding: 0; transition: transform .25s ease, border-color .25s ease, box-shadow .25s ease; }
  .big:hover { transform: scale(1.06); border-color: var(--six); box-shadow: 0 0 40px rgba(127,211,255,.25); }
  .big svg { width: 42%; height: 42%; }
  .big:focus-visible, .mini:focus-visible { outline: 2px solid var(--six); outline-offset: 3px; }
  .mini { position: absolute; right: 12px; bottom: 14px; width: 34px; height: 34px; border: 0; border-radius: 50%; background: rgba(5,6,8,.35); color: var(--chalk); opacity: .0; display: grid; place-items: center; cursor: pointer; padding: 0; transition: opacity .3s ease; }
  .frame:hover .mini, .mini:focus-visible { opacity: .75; }
  .mini svg { width: 16px; height: 16px; }
  .bar { position: absolute; left: 0; bottom: 0; height: 2px; width: 100%; background: transparent; }
  .bar i { display: block; height: 100%; width: 0; background: var(--six); opacity: .55; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  @media (prefers-reduced-motion: reduce) { .big, .veil { transition: none; } }
</style>

<div class="frame" id="frame">
  <canvas id="cv" aria-label="First-person 3D animation: Gojo teaches a class and only he hears distant explosions"></canvas>
  <div class="veil" id="veil">
    <button class="big" id="go" type="button" aria-label="Play with sound">
      <svg id="goIcon" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15l12.5-7.5z" fill="currentColor"/></svg>
    </button>
  </div>
  <button class="mini" id="fs" type="button" aria-label="Fullscreen">
    <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
  </button>
  <div class="bar" aria-hidden="true"><i id="prog"></i></div>
</div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.min.js';

// ───────────────────────── helpers ─────────────────────────
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const sm = t => t * t * (3 - 2 * t);
const eio = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const eout = t => 1 - Math.pow(1 - t, 3);
const ein = t => t * t * t;
const back = t => { const c = 1.6; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };
const lin = t => t;
const TAU = Math.PI * 2;
function rng(seed) { let s = seed >>> 0; return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296); }
// smooth 1D value noise, deterministic
function vnoise(x, seed = 0) {
  const h = n => { const s = Math.sin(n * 127.1 + seed * 311.7) * 43758.5453; return s - Math.floor(s); };
  const i = Math.floor(x), f = x - i, u = f * f * (3 - 2 * f);
  return lerp(h(i), h(i + 1), u) * 2 - 1;
}
// keyframe track: keys = [[time, value, easeIntoThisKey?], ...]; values are numbers or arrays
function track(keys, def = sm) {
  return t => {
    if (t <= keys[0][0]) return keys[0][1];
    for (let i = 1; i < keys.length; i++) {
      if (t <= keys[i][0]) {
        const [t0, v0] = keys[i - 1], [t1, v1, e] = keys[i];
        const k = (e || def)((t - t0) / (t1 - t0));
        return Array.isArray(v0) ? v0.map((x, j) => lerp(x, v1[j], k)) : lerp(v0, v1, k);
      }
    }
    return keys[keys.length - 1][1];
  };
}
// a pulse that rises fast and decays: 0 before t0
const hit = (t, t0, decay = 4) => t < t0 ? 0 : Math.exp(-(t - t0) * decay);

// ───────────────────────── master timeline (seconds) ─────────────────────────
const T = {
  open: 1.2, chalkUp: 2.3, drawStart: 3.6, tapA: 19.45, tapB: 19.85, chalkDown: 20.3,
  turn: 21.0, turned: 24.0, boom1: 37.0, boom2: 44.0, walkEnd: 51.0, boom3: 50.0,
  handUp: 54.0, pull: 56.1, reveal: 57.0, boom4: 58.4, end: 64.5
};

// ───────────────────────── renderer / scene / camera ─────────────────────────
const cv = document.getElementById('cv');
const renderer = new THREE.WebGLRenderer({ canvas: cv, antialias: false, powerPreference: 'high-performance', preserveDrawingBuffer: false });

renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.NoToneMapping;
renderer.autoClear = true;

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xbfd6e6, 70, 560);
const camera = new THREE.PerspectiveCamera(62, 16 / 9, 0.02, 600);
camera.rotation.order = 'YXZ';
scene.add(camera);

// toon ramp: four soft bands, the "indie anime" look
const ramp = (() => {
  const d = new Uint8Array([70, 70, 70, 255, 140, 140, 140, 255, 205, 205, 205, 255, 255, 255, 255, 255]);
  const tx = new THREE.DataTexture(d, 4, 1, THREE.RGBAFormat);
  tx.minFilter = tx.magFilter = THREE.NearestFilter; tx.generateMipmaps = false; tx.needsUpdate = true;
  return tx;
})();
const toon = (color, o = {}) => new THREE.MeshToonMaterial({ color, gradientMap: ramp, ...o });
const std = (color, o = {}) => new THREE.MeshStandardMaterial({ color, roughness: .85, metalness: 0, ...o });

const olCache = new Map();
function olMat(w, color = 0x17121c) {
  const k = w + ':' + color;
  if (!olCache.has(k)) olCache.set(k, new THREE.ShaderMaterial({
    uniforms: { w: { value: w }, c: { value: new THREE.Color(color) } },
    vertexShader: 'uniform float w; void main(){ vec3 p = position + normal * w; gl_Position = projectionMatrix * modelViewMatrix * vec4(p, 1.0); }',
    fragmentShader: 'uniform vec3 c; void main(){ gl_FragColor = vec4(c, 1.0); }',
    side: THREE.BackSide
  }));
  return olCache.get(k);
}
// mesh factory: geometry + material, optional outline, shadows on
function mk(geo, mat, { ol = 0, cast = true, recv = true, olColor } = {}) {
  const m = new THREE.Mesh(geo, mat);
  m.castShadow = cast; m.receiveShadow = recv;
  if (ol) { const o = new THREE.Mesh(geo, olMat(ol, olColor)); o.castShadow = false; o.receiveShadow = false; m.add(o); }
  return m;
}
// rounded box: every vertex pushed out from an inner box by radius r
function rbox(w, h, d, r, s = 5) {
  const g = new THREE.BoxGeometry(w, h, d, s, s, s), p = g.attributes.position, iw = w / 2 - r, ih = h / 2 - r, id = d / 2 - r, v = new THREE.Vector3(), c = new THREE.Vector3();
  for (let i = 0; i < p.count; i++) {
    v.fromBufferAttribute(p, i); c.set(clamp(v.x, -iw, iw), clamp(v.y, -ih, ih), clamp(v.z, -id, id));
    v.sub(c).normalize().multiplyScalar(r).add(c); p.setXYZ(i, v.x, v.y, v.z);
  }
  g.computeVertexNormals(); return g;
}
const G = {
  box: (x, y, z) => new THREE.BoxGeometry(x, y, z),
  sph: (r, w = 24, h = 16, ...a) => new THREE.SphereGeometry(r, w, h, ...a),
  cap: (r, l, s = 6, rs = 12) => new THREE.CapsuleGeometry(r, l, s, rs),
  cyl: (a, b, h, s = 16) => new THREE.CylinderGeometry(a, b, h, s),
  cone: (r, h, s = 10) => new THREE.ConeGeometry(r, h, s)
};
function at(obj, x, y, z, parent) { obj.position.set(x, y, z); if (parent) parent.add(obj); return obj; }
// orient a unit-height Y-aligned mesh to span from point a to point b
const _up = new THREE.Vector3(0, 1, 0), _v = new THREE.Vector3();
function span(mesh, a, b) {
  _v.subVectors(b, a); const len = _v.length();
  mesh.position.copy(a).addScaledVector(_v, .5);
  mesh.quaternion.setFromUnitVectors(_up, _v.normalize());
  mesh.scale.set(1, Math.max(len, 1e-4), 1);
}

// ───────────────────────── the classroom ─────────────────────────
// Room: x -5..5 (window wall at -5, corridor at +5), z -6 (blackboard) .. 5 (back), y 0..3.3
const ROOM = { x0: -5, x1: 5, z0: -6, z1: 5, h: 3.3, dais: 0.16, daisZ: -4.45 };
const room = new THREE.Group(); scene.add(room);

function canvasTex(w, h, draw, repeat) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const tx = new THREE.CanvasTexture(c); tx.colorSpace = THREE.SRGBColorSpace; tx.anisotropy = 8;
  if (repeat) { tx.wrapS = tx.wrapT = THREE.RepeatWrapping; tx.repeat.set(...repeat); }
  return tx;
}
// wooden floor planks
const floorTex = canvasTex(1024, 1024, (g, w, h) => {
  const r = rng(11), n = 8, pw = w / n;
  for (let i = 0; i < n; i++) {
    let y = -r() * 300;
    while (y < h) {
      const len = 260 + r() * 360, l = 46 + r() * 10, hue = 28 + r() * 6;
      g.fillStyle = `hsl(${hue} 42% ${l}%)`; g.fillRect(i * pw, y, pw, len);
      for (let k = 0; k < 14; k++) { // grain
        g.strokeStyle = `hsla(${hue - 4} 45% ${l - 12}% / ${.12 + r() * .15})`; g.lineWidth = 1 + r() * 2;
        const gx = i * pw + r() * pw; g.beginPath(); g.moveTo(gx, y); g.bezierCurveTo(gx + 6, y + len * .3, gx - 6, y + len * .7, gx + r() * 4, y + len); g.stroke();
      }
      g.fillStyle = 'rgba(40,22,10,.55)'; g.fillRect(i * pw, y, pw, 3);
      y += len;
    }
    g.fillStyle = 'rgba(40,22,10,.6)'; g.fillRect(i * pw, 0, 3, h);
  }
}, [2.5, 2.75]);
const floor = mk(new THREE.PlaneGeometry(10, 11), std(0xffffff, { map: floorTex, roughness: .55 }), { cast: false });
floor.rotation.x = -Math.PI / 2; at(floor, 0, 0, -0.5, room);

// teacher's dais along the front
const dais = mk(G.box(10, ROOM.dais, 1.55), std(0xffffff, { map: floorTex, roughness: .5 }));
at(dais, 0, ROOM.dais / 2, -5.225, room);
at(mk(G.box(10, ROOM.dais - .02, .03), toon(0x5a3a22)), 0, ROOM.dais / 2, ROOM.daisZ, room);

const plaster = toon(0xeee5d2), woodDark = toon(0x6b4428), woodMid = toon(0x9a6a40), trim = toon(0x4b3020);
function wall(w, h, mat) { return mk(new THREE.PlaneGeometry(w, h), mat, { cast: true }); }
// front wall
at(wall(10, ROOM.h, plaster), 0, ROOM.h / 2, ROOM.z0, room);
// back wall
const bw = wall(10, ROOM.h, plaster); bw.rotation.y = Math.PI; at(bw, 0, ROOM.h / 2, ROOM.z1, room);
// corridor wall (+x)
const cw = wall(11, ROOM.h, plaster); cw.rotation.y = -Math.PI / 2; at(cw, ROOM.x1, ROOM.h / 2, -0.5, room);
// wainscot all round
for (const [w, x, z, ry] of [[10, 0, ROOM.z0 + .01, 0], [10, 0, ROOM.z1 - .01, Math.PI], [11, ROOM.x1 - .01, -.5, -Math.PI / 2]]) {
  const p = mk(new THREE.PlaneGeometry(w, .9), woodMid, { cast: false }); p.rotation.y = ry; at(p, x, .45, z, room);
  const r = mk(G.box(w, .05, .04), trim); r.rotation.y = ry; at(r, x, .92, z, room);
}
// ceiling + beams + lights
const ceil = mk(new THREE.PlaneGeometry(10.4, 11.4), toon(0xf4efe4), { cast: true, recv: false }); ceil.rotation.x = Math.PI / 2; at(ceil, 0, ROOM.h, -.5, room);
for (let z = -5; z <= 4.5; z += 2.4) at(mk(G.box(10, .14, .18), woodDark), 0, ROOM.h - .07, z, room);
const tubeMat = new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0xfff6e8, emissiveIntensity: .5 });
for (const x of [-2.4, 0, 2.4]) for (const z of [-3.6, -1.2, 1.2, 3.4]) {
  at(mk(G.box(1.25, .05, .16), toon(0xdcdcd8)), x, ROOM.h - .05, z, room);
  at(mk(G.box(1.18, .03, .07), tubeMat, { cast: false }), x, ROOM.h - .085, z, room);
}

// ── blackboard (canvas texture, drawn on in the chalk section) ──
const BOARD = { w: 4.4, h: 1.375, x: 0, y: 1.68, z: ROOM.z0 + .052, px: 2048, py: 640 };
const boardCanvas = document.createElement('canvas'); boardCanvas.width = BOARD.px; boardCanvas.height = BOARD.py;
const bctx = boardCanvas.getContext('2d');
const boardTex = new THREE.CanvasTexture(boardCanvas); boardTex.colorSpace = THREE.SRGBColorSpace; boardTex.anisotropy = 8;
const boardMesh = mk(new THREE.PlaneGeometry(BOARD.w, BOARD.h), std(0xffffff, { map: boardTex, roughness: .92 }), { cast: false });
at(boardMesh, BOARD.x, BOARD.y, BOARD.z, room);
at(mk(G.box(BOARD.w + .14, BOARD.h + .14, .04), toon(0x7a5434)), BOARD.x, BOARD.y, ROOM.z0 + .02, room);
const tray = at(mk(G.box(BOARD.w + .1, .035, .1), toon(0x8c6a48)), BOARD.x, BOARD.y - BOARD.h / 2 - .06, ROOM.z0 + .09, room);
const chalkCols = [0xf4f4ee, 0xf4f4ee, 0xf2d36b, 0xe86a5c, 0x6fb6e8];
chalkCols.forEach((c, i) => { const s = mk(G.cyl(.0065, .0065, .075, 8), toon(c)); s.rotation.z = Math.PI / 2 + (i - 2) * .12; at(s, -1.4 + i * .11, tray.position.y + .025, ROOM.z0 + .1, room); });
const eraser = at(mk(G.box(.14, .045, .055), toon(0x2c3a5a)), 1.55, tray.position.y + .04, ROOM.z0 + .1, room);
at(mk(G.box(.14, .012, .055), toon(0xb9b2a4)), 0, -.028, 0, eraser);

// ── wall clock with ticks only, no numerals ──
const clock = new THREE.Group(); at(clock, 3.15, 2.72, ROOM.z0 + .04, room);
at(mk(G.cyl(.2, .2, .05, 40), toon(0x30343a)), 0, 0, 0, clock).rotation.x = Math.PI / 2;
at(mk(G.cyl(.18, .18, .052, 40), toon(0xf7f4ec)), 0, 0, .002, clock).rotation.x = Math.PI / 2;
for (let i = 0; i < 12; i++) { const tk = mk(G.box(.008, i % 3 ? .022 : .04, .01), toon(0x222222)); const a = i / 12 * TAU; tk.position.set(Math.sin(a) * .155, Math.cos(a) * .155, .03); tk.rotation.z = -a; clock.add(tk); }
function clockHand(len, wid, col, z) { const p = new THREE.Group(); p.position.z = z; const b = mk(G.box(wid, len, .006), toon(col)); b.position.y = len * .4; p.add(b); clock.add(p); return p; }
const hourH = clockHand(.09, .014, 0x1c1c1c, .033), minH = clockHand(.14, .009, 0x1c1c1c, .037), secH = clockHand(.15, .003, 0xc8372d, .041);

// ── lectern, off to the right so the walk stays clear ──
const lectern = new THREE.Group(); at(lectern, 1.75, ROOM.dais, -4.95, room);
at(mk(G.box(.9, .95, .55), woodMid, { ol: .006 }), 0, .475, 0, lectern);
at(mk(G.box(.98, .04, .62), woodDark), 0, .97, 0, lectern);
at(mk(G.box(.3, .03, .22), toon(0x3c6e8f)), -.15, 1.005, .05, lectern).rotation.y = .3; // attendance book, closed
at(mk(G.box(.29, .02, .21), toon(0xf1eadb)), -.15, 1.0, .05, lectern).rotation.y = .3;

// ── back wall: cubbies and a pinboard with drawings (no words) ──
const cub = new THREE.Group(); at(cub, 0, 0, ROOM.z1 - .22, room);
at(mk(G.box(6, 1.1, .4), woodMid), 0, .55, 0, cub);
for (let i = 0; i < 12; i++) for (let j = 0; j < 2; j++) at(mk(G.box(.44, .44, .02), toon(0x3d2716), { cast: false }), -2.75 + i * .5, .3 + j * .5, -.19, cub);
const pin = at(mk(G.box(3.2, 1.0, .03), toon(0xb08a5e)), -.4, 2.0, ROOM.z1 - .02, room);
const paperCols = [0xf6f0e0, 0xdff0f7, 0xfbe3e3, 0xf6f0e0, 0xe8f3d8];
paperCols.forEach((c, i) => { const p = mk(G.box(.42, .55, .005), toon(c)); p.rotation.z = (i % 2 ? .05 : -.04); at(p, -1.2 + i * .6, (i % 2) * .1, -.02, pin); at(mk(G.sph(.015, 8, 6), toon(0xd03030)), 0, .24, -.006, p); });

// ── corridor wall: two sliding doors with frosted glass ──
const frost = new THREE.MeshStandardMaterial({ color: 0xe9eef0, emissive: 0xdfe8ea, emissiveIntensity: .45, roughness: .4 });
for (const z of [-4.6, 3.6]) {
  const d = new THREE.Group(); at(d, ROOM.x1 - .03, 0, z, room); d.rotation.y = -Math.PI / 2;
  at(mk(G.box(1.8, 2.05, .06), woodMid, { ol: .005 }), 0, 1.025, 0, d);
  for (const dx of [-.45, .45]) at(mk(G.box(.66, .8, .02), frost, { cast: false }), dx, 1.5, .035, d);
  at(mk(G.box(.02, 2.05, .07), trim), 0, 1.025, .01, d);
  at(mk(G.box(.08, .03, .02), toon(0x2a2a2a)), .78, 1.0, .04, d);
}
for (let z = -4.5; z < 4.6; z += 1.2) at(mk(G.box(.02, .38, 1.0), frost, { cast: false }), ROOM.x1 - .02, 2.75, z, room);

// ── window wall (x = -5): four bays, real openings so sunlight comes through ──
const winMat = new THREE.MeshPhysicalMaterial({ color: 0xdff2ff, roughness: .05, transmission: 0, transparent: true, opacity: .05, depthWrite: false });
const frameMat = toon(0xd9d6cf);
const BAYS = [-4.0, -1.6, 0.8, 3.2], BAYW = 2.1, SILL = .95, TOP = 2.65;
const ww = new THREE.Group(); ww.position.x = ROOM.x0; room.add(ww);
function wwBox(y0, y1, z0, z1, mat = plaster) { const b = mk(G.box(.22, y1 - y0, z1 - z0), mat); at(b, -.08, (y0 + y1) / 2, (z0 + z1) / 2, ww); return b; }
wwBox(0, SILL, ROOM.z0, ROOM.z1, woodMid); wwBox(TOP, ROOM.h, ROOM.z0, ROOM.z1);
let zc = ROOM.z0;
BAYS.forEach(bz => { wwBox(SILL, TOP, zc, bz - BAYW / 2); zc = bz + BAYW / 2; }); wwBox(SILL, TOP, zc, ROOM.z1);
at(mk(G.box(.34, .04, 10.9), toon(0xcfc6b4)), .06, SILL, -.5, ww);
const sashes = [];
BAYS.forEach((bz, bi) => {
  for (const k of [-1, 1]) {
    const s = new THREE.Group(); at(s, k < 0 ? -.03 : -.11, (SILL + TOP) / 2, bz + k * BAYW / 4, ww);
    const w = BAYW / 2 + .03, h = TOP - SILL;
    for (const [sx, sy, px, py] of [[.03, .04, 0, h / 2], [.03, .04, 0, -h / 2], [.03, .03, 0, h * .12]]) at(mk(G.box(sx, sy, w), frameMat, { cast: false }), px, py, 0, s);
    for (const pz of [-w / 2, w / 2]) at(mk(G.box(.03, h, .04), frameMat), 0, 0, pz, s);
    const gl = new THREE.Mesh(new THREE.PlaneGeometry(w, h), winMat); gl.rotation.y = Math.PI / 2; s.add(gl);
    if (bi === 1 && k === 1) s.position.z -= .55; // one window slid half open
    sashes.push(s);
  }
});
// curtains bunched beside each bay
const curtainMat = toon(0xf1e6c8, { side: THREE.DoubleSide });
const curtains = [];
[...BAYS.map(b => b - BAYW / 2 - .02), BAYS[3] + BAYW / 2 + .02].forEach((cz, i) => {
  const geo = new THREE.CylinderGeometry(.09, .13, 2.3, 10, 6, true);
  const pos = geo.attributes.position; for (let v = 0; v < pos.count; v++) { const a = Math.atan2(pos.getZ(v), pos.getX(v)); const r = 1 + .25 * Math.sin(a * 5); pos.setX(v, pos.getX(v) * r); pos.setZ(v, pos.getZ(v) * r); }
  geo.computeVertexNormals();
  const c = mk(geo, curtainMat); at(c, ROOM.x0 + .2, 1.75, cz, room); curtains.push(c);
});

// ───────────────────────── outside: Jujutsu High in the mountains ─────────────────────────
