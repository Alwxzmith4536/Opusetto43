// light level 0..1 over time (flickers)
function lightLevel(t) {
  let L = 1;
  if (t > 41.0 && t < 42.3) { const k = Math.floor(t * 18); if (hash(k) < 0.35) L = 0.35; }
  if (t > 47.0 && t < 48.8) { const k = Math.floor(t * 22); L = hash(k + 7) < 0.55 ? 0.12 : 0.7; }

  if (t > 55.6 && t < 56.6) { const k = Math.floor(t * 16); if (hash(k + 3) < 0.5) L = 0.15; }

const faceCache = new Map();
function faceTex(kind, st) {

  t.wrapS = t.wrapT = THREE.ClampToEdgeWrapping;

}
function px(g, x, y, w, h, c) { g.fillStyle = c; g.fillRect(x, y, w, h); }
function drawNaga(g, { eyes, mouth, blush }) {
  const lash = '#140808', iris = '#9a3524', pup = '#3a0d0a';
  if (blush) { px(g, 5, 20, 5, 2, 'rgba(235,90,90,.55)'); px(g, 22, 20, 5, 2, 'rgba(235,90,90,.55)'); }
  // brows: smug tilt
  if (eyes === 'wide') { px(g, 7, 8, 6, 1, lash); px(g, 19, 8, 6, 1, lash); }
  else { px(g, 7, 10, 3, 1, lash); px(g, 10, 9, 3, 1, lash); px(g, 19, 9, 3, 1, lash); px(g, 22, 10, 3, 1, lash); }
  for (const ex of [7, 19]) {
    const mir = ex === 19;
    if (eyes === 'closed') { px(g, ex, 16, 1, 1, lash); px(g, ex + 1, 15, 4, 1, lash); px(g, ex + 5, 16, 1, 1, lash); continue; }
    if (eyes === 'smug') {
      px(g, ex, 14, 6, 1, lash); px(g, mir ? ex + 6 : ex - 1, 14, 1, 1, lash);
      px(g, ex + 1, 15, 4, 3, '#f4ece6'); px(g, ex + 2, 15, 3, 3, iris); px(g, ex + 3, 16, 1, 2, pup); px(g, ex + 2, 15, 1, 1, '#fff');
      continue;
    }
    const top = eyes === 'wide' ? 11 : 12;
    px(g, ex, top, 6, 1, lash); px(g, mir ? ex + 6 : ex - 1, top, 1, 2, lash);
    px(g, ex + 1, top + 1, 4, 6, '#f4ece6');
    px(g, ex + 1, top + 1, 4, 5, iris);
    if (eyes === 'wide') px(g, ex + 2, top + 3, 2, 2, pup); else px(g, ex + 2, top + 2, 2, 4, pup);
    px(g, ex + 1, top + 1, 1, 2, '#fff'); px(g, ex + 4, top + 4, 1, 1, '#ffb3a0');
    px(g, ex, top + 7, 6, 1, 'rgba(60,20,20,.35)');
  }
  px(g, 15, 20, 1, 1, '#9a5a36');
  const lip = '#4a1714';
  if (mouth === 'smirk') { px(g, 13, 24, 5, 1, lip); px(g, 18, 23, 1, 1, lip); px(g, 12, 23, 1, 1, lip); px(g, 14, 25, 1, 1, '#fff'); }
  else if (mouth === 'open') { px(g, 13, 23, 6, 3, lip); px(g, 14, 23, 1, 1, '#fff'); px(g, 15, 25, 3, 1, '#c25a5c'); }
  else if (mouth === 'grin') { px(g, 12, 23, 8, 2, lip); px(g, 13, 25, 6, 1, lip); px(g, 13, 23, 1, 1, '#fff'); px(g, 18, 23, 1, 1, '#fff'); px(g, 14, 25, 4, 1, '#c25a5c'); }
  else if (mouth === 'o') { px(g, 15, 23, 3, 3, lip); }
  else { px(g, 14, 24, 4, 1, lip); }
}
function drawSenpai(g, { eyes, mouth, blush, sweat }) {
  const ink = '#16161c';
  if (blush) { px(g, 5, 20, 6, 2, 'rgba(235,90,100,.6)'); px(g, 21, 20, 6, 2, 'rgba(235,90,100,.6)'); px(g, 6, 21, 1, 1, '#e05060'); px(g, 9, 21, 1, 1, '#e05060'); }
  for (const ex of [7, 19]) {

  if (sweat) { px(g, 26, 8, 2, 3, '#9fd6ff'); px(g, 26, 11, 1, 1, '#d8f0ff'); }
}

function makeChar(cfg) {
  const root = new THREE.Group(); root.scale.setScalar(cfg.scale);
  const skin = M(cfg.skin, { emissive: new THREE.Color(cfg.skin).multiplyScalar(0.22) }), top = M(cfg.top), bot = M(cfg.bottom), hair = M(cfg.hair, { roughness: 0.6 });
  const legM = M(cfg.leg), sock = M(cfg.sock), shoe = M(0x2a1a14, { roughness: 0.4 }), sleeve = M(cfg.sleeve ?? cfg.top);
  const hips = new THREE.Group(); hips.position.y = 0.88; root.add(hips);
  const spine = new THREE.Group(); hips.add(spine);
  cyl(cfg.chest, cfg.waist, 0.5, 8, top, spine, 0, 0.26, 0);
  cyl(cfg.waist, cfg.waist * 1.05, 0.14, 8, bot, hips, 0, 0.0, 0);
  cyl(0.045, 0.05, 0.1, 6, skin, spine, 0, 0.55, 0);
  cfg.dressTorso?.(spine);
  const head = new THREE.Group(); head.position.y = 0.6; spine.add(head);
  const skull = ball(0.135, skin, head, 0, 0.13, 0, 10, 8); skull.scale.set(1, 1.1, 1);
  ball(0.06, skin, head, 0, 0.05, 0.06, 6, 4);   // jaw
  const faceMat = new THREE.MeshStandardMaterial({ map: faceTex(cfg.kind, cfg.face0), emissiveMap: faceTex(cfg.kind, cfg.face0), emissive: 0x3a3a3a, transparent: true, alphaTest: 0.4, roughness: 0.8 });
  const face = add(new THREE.Mesh(new THREE.PlaneGeometry(0.2, 0.2), faceMat), head, 0, 0.115, 0.128, false);
  cfg.buildHair(head, hair);
  const shoulders = [], elbows = [], legs = [], knees = [];
  for (const side of [1, -1]) {
    const sh = new THREE.Group(); sh.position.set(side * (cfg.chest + 0.04), 0.47, 0); spine.add(sh);
    cyl(0.045, 0.04, 0.27, 6, sleeve, sh, 0, -0.135, 0);
    const el = new THREE.Group(); el.position.y = -0.27; sh.add(el);
    cyl(0.038, 0.032, 0.24, 6, cfg.forearmSleeve ? sleeve : skin, el, 0, -0.12, 0);
    ball(0.04, skin, el, 0, -0.27, 0.0, 6, 4);
    shoulders.push(sh); elbows.push(el);
    const hp = new THREE.Group(); hp.position.set(side * 0.09, -0.04, 0); hips.add(hp);
    cyl(0.068, 0.052, 0.42, 7, legM, hp, 0, -0.21, 0);
    const kn = new THREE.Group(); kn.position.y = -0.42; hp.add(kn);
    cyl(0.05, 0.04, 0.2, 7, legM, kn, 0, -0.1, 0);
    cyl(0.052, 0.042, 0.22, 7, sock, kn, 0, -0.29, 0);
    box(0.09, 0.06, 0.2, shoe, kn, 0, -0.42, 0.04);
    legs.push(hp); knees.push(kn);
  }
  cfg.dressHips?.(hips, bot);
  root.traverse(o => { if (o.isMesh && o !== face) o.castShadow = true; });
  return { root, hips, spine, head, face, faceMat, shoulders, elbows, legs, knees, kind: cfg.kind };
}

function blobGeo(r, seed) {
  const q = rng(seed), shape = new THREE.Shape(), n = 14;
  for (let i = 0; i <= n; i++) {
    const a = i / n * PI * 2, rr = r * (0.75 + q() * 0.5) * (i % 3 === 0 ? 1.25 : 1);
    i ? shape.lineTo(Math.cos(a) * rr * 1.3, Math.sin(a) * rr) : shape.moveTo(Math.cos(a) * rr * 1.3, Math.sin(a) * rr);
  }
  return new THREE.ShapeGeometry(shape);
}

    if (ag > 0.02) {
      ctx.globalAlpha = 0.25 * ag; ctx.globalCompositeOperation = 'lighter';
      const o = 6 + 10 * ag;
      ctx.drawImage(renderer.domElement, -8 + o, -4.5, W + 16, H + 9);
      ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
      // horizontal tear glitch
      const r = rng(Math.floor(t * 24));
      for (let i = 0; i < 4 * ag; i++) {
        const y = r() * H | 0, h = 6 + r() * 30 | 0, dx = (r() - 0.5) * 60 * ag;
        ctx.drawImage(out, 0, y, W, h, dx, y, W, h);
      }
    }
    // red-tinted grade as it turns
    const red = ss(55.5, 61, t) * 0.25 + lunge * 0.35;
    if (red > 0) { ctx.fillStyle = `rgba(120,0,10,${red})`; ctx.globalCompositeOperation = 'multiply'; ctx.fillRect(0, 0, W, H); ctx.globalCompositeOperation = 'source-over'; }
    drawInk(t);
  }
  drawLids(lidAmount(t), t);
  // grain
  ctx.globalAlpha = 0.07; ctx.globalCompositeOperation = 'overlay';
  ctx.drawImage(grain[Math.floor(t * 24) % grain.length], 0, 0, W, H);
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  drawSubs(t);
  drawCards(t);
  // letterbox
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, 34); ctx.fillRect(0, H - 34, W, 34);
}

function renderFrame(t) {
  updateCamera(t);
  updateWorld(t);
  if (t < BLACK) renderer.render(scene, camera);
  composite(t);
}

// ---------- export / playback ----------
window.__eyes = eyes;
window.TIMELINE = { DUR, LINES, CPS, EYES: EYES.map(e => ({ t: e.t, hide: e.hide || null })), STEPS: stepsTimes(), LUNGE, BLACK, FLICKER: [[41.0, 42.3], [47.0, 48.8], [55.6, 56.6], [60.2, LUNGE]] };
window.renderFrame = (t) => { renderFrame(t); return out.toDataURL('image/jpeg', 0.93); };
await document.fonts.load(`30px "DotGothic16"`).catch(() => {});
window.__ready = true;

if (!RENDER) {
  const aud = document.getElementById('aud'), playBtn = document.getElementById('play');
  const fill = document.getElementById('progFill'), timeEl = document.getElementById('time'), prog = document.getElementById('prog');
  let playing = false, t0 = 0, base = 0;
  const fmt = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
  const now = () => playing ? Math.min(DUR, base + (performance.now() - t0) / 1000) : base;
  function setPlaying(p) {
    if (p === playing) return;
    if (p) { if (base >= DUR) base = 0; t0 = performance.now(); aud.currentTime = base; aud.play().catch(() => {}); }
    else { base = now(); aud.pause(); }
    playing = p; playBtn.textContent = p ? 'Pause' : 'Play';
  }
  function seek(s) { base = clamp(s, 0, DUR); t0 = performance.now(); aud.currentTime = base; }
  playBtn.onclick = () => setPlaying(!playing);
  document.getElementById('restart').onclick = () => { seek(0); setPlaying(true); };
  prog.onclick = e => { const r = prog.getBoundingClientRect(); seek((e.clientX - r.left) / r.width * DUR); };
  prog.onkeydown = e => { if (e.key === 'ArrowRight') seek(now() + 5); if (e.key === 'ArrowLeft') seek(now() - 5); };
  (function loop() {
    const t = now();
    if (playing && t >= DUR) setPlaying(false);
    renderFrame(t);
    fill.style.width = (t / DUR * 100) + '%';
    timeEl.textContent = `${fmt(t)} / ${fmt(DUR)}`;
    requestAnimationFrame(loop);
  })();
}
</script>
</body>
</html>
