function placeArm(a, from, to, reach, t) {
  const vis = reach > 0.01;
  a.arm.visible = a.hand.visible = a.drip.visible = vis;
  if (!vis) return;
  const tip = from.clone().lerp(to, reach);
  const d = tip.clone().sub(from), len = d.length();
  a.arm.position.copy(from).addScaledVector(d, 0.5);
  a.arm.quaternion.setFromUnitVectors(UP, d.clone().normalize());
  a.arm.scale.set(1 + 0.05 * Math.sin(t * 7 + a.side), len, 1);
  a.hand.position.copy(tip); a.hand.quaternion.copy(a.arm.quaternion);
  const dl = 0.1 + 0.25 * ((t * 0.7 + a.side * 0.3) % 1);
  a.drip.position.set(tip.x, tip.y - 0.08 - dl / 2, tip.z); a.drip.scale.set(1, dl, 1);
}

}

const tmpV = new THREE.Vector3();
function updateEyes(t) {
  for (const e of eyes) {
    let open = ss(e.t, e.t + 0.5, t);
    if (e.hide) open *= 1 - ss(e.hide[0], e.hide[0] + 0.25, t) * (1 - ss(e.hide[1], e.hide[1] + 0.4, t));
    const gooS = ss(e.t - 0.25, e.t + 0.35, t) * (e.hide ? 1 - 0.7 * ss(e.hide[0], e.hide[0] + 0.3, t) * (1 - ss(e.hide[1], e.hide[1] + 0.4, t)) : 1);
    e.g.visible = gooS > 0.01;
    if (!e.g.visible) continue;
    e.goo.scale.setScalar(Math.max(gooS, 0.001) * (1 + 0.03 * Math.sin(t * 3 + e.t)));
    const blink = (t - e.t) % 4.3 < 0.12 ? 0.1 : 1;
    e.sclera.scale.y = Math.max(open * blink, 0.001);
    e.sclera.visible = open > 0.02;
    e.pupil.visible = open > 0.3;
    // pupil tracks Seek (the camera)
    tmpV.copy(camera.position); e.g.worldToLocal(tmpV);
    const len = Math.hypot(tmpV.x, tmpV.y) || 1, k = Math.min(1, len / 3) * e.s * 0.2;
    e.pupil.position.set(tmpV.x / len * k * 1.3, tmpV.y / len * k, 0.01);
    e.pupil.scale.y = Math.max(open * blink, 0.001);
    e.drips.forEach((d, k2) => { const L = gooS * e.s * (0.4 + 0.6 * ((t - e.t) * (0.15 + k2 * 0.07) % 1.2)); d.scale.y = Math.max(L, 0.001); d.position.y = -e.s * 0.35 - L / 2; });
  }
}

    centerText('PART 5 — AFTER DARK', H / 2 + 40, 30, '#ffb36a', ta, 4);
    centerText('fan-made · Nagatoro × DOORS', H / 2 + 90, 18, '#6f6573', ta);
  }
  const ra = ss(INSIDE - 0.4, INSIDE + 0.2, t) * (1 - ss(INSIDE + 3.5, INSIDE + 4.5, t));
  if (ra > 0) { ctx.save(); ctx.globalAlpha = ra; ctx.font = `22px ${FONT}`; ctx.fillStyle = '#e8c672'; ctx.fillText('BAR KITSUNE — OPEN TILL DAWN', 64, 74); ctx.restore(); }
  const ea = ss(END + 0.8, END + 1.6, t) * (1 - ss(DUR - 1.2, DUR - 0.2, t));
  if (ea > 0) {
    centerText('TO BE CONTINUED', H / 2 - 10, 64, '#e9e4da', ea, 6);
    centerText('NEXT — PART 6: LAST CALL', H / 2 + 48, 26, '#ffb36a', ea * ss(END + 2, END + 2.8, t), 3);
  }
}
function composite(t) {
  ctx.imageSmoothingEnabled = false;
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  if (t < END) {
    ctx.drawImage(renderer.domElement, -8, -4.5, W + 16, H + 9);
    const ag = impulse(t, BURP, 1.2, 2);
    if (ag > 0.02) {
      ctx.globalAlpha = Math.min(0.4, 0.25 * ag); ctx.globalCompositeOperation = 'lighter';
      ctx.drawImage(renderer.domElement, -8 + 6 + 10 * ag, -4.5, W + 16, H + 9);
      ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
    }
    // warm, slightly woozy glow after the beer
    const buzz = ss(DRINK1, BURP + 2, t);
    if (buzz > 0) { ctx.fillStyle = `rgba(255,170,80,${0.08 * buzz})`; ctx.globalCompositeOperation = 'soft-light'; ctx.fillRect(0, 0, W, H); ctx.globalCompositeOperation = 'source-over'; }
    drawInk(t, 0.8);
  }
  drawLids(lidAmount(t), t);
  ctx.globalAlpha = 0.07; ctx.globalCompositeOperation = 'overlay';
  ctx.drawImage(grain[Math.floor(t * 24) % grain.length], 0, 0, W, H);
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  drawSubs(t);
  drawCards(t);
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, 34); ctx.fillRect(0, H - 34, W, 34);
}
function renderFrame(t) {
  updateCamera(t);
  updateWorld(t);
  if (t < END) renderer.render(scene, camera);
  composite(t);
}

// ---------- export / playback ----------
window.__eyes = eyes;
const STEPS = []; for (let t = 3.5; t < INSIDE - 0.6; t += 0.98) STEPS.push(+t.toFixed(3));
window.TIMELINE = { DUR, LINES, CPS, EYES: [], STEPS, SFX, INSIDE, END, LIFT, DRINK1 };
window.renderFrame = (t) => { renderFrame(t); return out.toDataURL('image/jpeg', 0.93); };
await document.fonts.load(`30px "DotGothic16"`).catch(() => {});
window.__ready = true;

if (!RENDER) {
  const aud = document.getElementById('aud'), playBtn = document.getElementById('play');
  const fill = document.getElementById('progFill'), timeEl = document.getElementById('time'), prog = document.getElementById('prog');
  let playing = false, t0 = 0, base = 0;
  const fmt = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
  const now = () => playing ? Math.min(DUR, base + (performance.now() - t0) / 1000) : base;
  function setPlaying(p) {
    if (p === playing) return;
    if (p) { if (base >= DUR) base = 0; t0 = performance.now(); aud.currentTime = base; aud.play().catch(() => {}); }
    else { base = now(); aud.pause(); }
    playing = p; playBtn.textContent = p ? 'Pause' : 'Play';
  }
  function seek(s) { base = clamp(s, 0, DUR); t0 = performance.now(); aud.currentTime = base; }
  playBtn.onclick = () => setPlaying(!playing);
  document.getElementById('restart').onclick = () => { seek(0); setPlaying(true); };
  prog.onclick = e => { const r = prog.getBoundingClientRect(); seek((e.clientX - r.left) / r.width * DUR); };
  prog.onkeydown = e => { if (e.key === 'ArrowRight') seek(now() + 5); if (e.key === 'ArrowLeft') seek(now() - 5); };
  (function loop() {
    const t = now();
    if (playing && t >= DUR) setPlaying(false);
    renderFrame(t);
    fill.style.width = (t / DUR * 100) + '%';
    timeEl.textContent = `${fmt(t)} / ${fmt(DUR)}`;
    requestAnimationFrame(loop);
  })();
}
</script>
