  if (t < 6) ns = { eyes: 'cry', mouth: 'scream', goo: true };
  if (t > 6 && t < PUNCH) ns = { eyes: 'wide', mouth: 'o', goo: true };
  if (t > HIDE) ns = { eyes: blinkAt(t, 0.5) ? 'closed' : 'wide', mouth: 'flat', goo: true };
  if (t > 49.6) ns = { eyes: 'cry', mouth: 'smirk', goo: true, blush: t > 53 };
  if (t < 6) ss_ = { eyes: 'angry', mouth: 'open' };
  if (t > 11.5 && t < HIDE) ss_ = { eyes: 'wide', mouth: 'wavy', sweat: true };
  if (t > HIDE) ss_ = { eyes: blinkAt(t, 2) ? 'closed' : 'wide', mouth: 'wavy', sweat: true };
  if (t > 52.8) ss_ = { eyes: 'open', mouth: 'flat', blush: true };
  if (talking(t, 'N')) ns = { ...ns, mouth: ns.mouth === 'scream' ? 'scream' : 'open' };
  if (talking(t, 'S')) ss_ = { ...ss_, mouth: 'open' };
  face(n, ns);
  face(s, { ...ss_, eyes: ss_.eyes === 'angry' ? 'wide' : ss_.eyes });
  mop.visible = false; phone.visible = false;
  // ---- Seek's arms ----
  if (t < FALL0) {
    placeArm(arms[0], shoulderOf(-1), grip(n), 1 - ss(DROP - 0.1, DROP + 0.5, t), t);
    camera.getWorldDirection(fwd);
    const up = camPos.clone().addScaledVector(fwd, 0.5).add(V(0.2, 1.2, 0));
    const slam = camPos.clone().addScaledVector(fwd, 1.3).setY(0.05);
    const wind = ss(12.4, 14.0, t), hit = ss(14.6, PUNCH, t);
    const tgt = up.clone().lerp(slam, hit);
    placeArm(arms[1], shoulderOf(1), tgt, wind * (1 - ss(PUNCH + 0.3, FALL0, t)) * 0.95, t);
  } else {
    placeArm(arms[0], shoulderOf(-1), camPos, 0, t);
    // reaching through the grass when it's right on top of them
    camera.getWorldDirection(fwd);
    placeArm(arms[1], shoulderOf(1), camPos.clone().addScaledVector(fwd, 1.2).add(V(0, -0.6, 0)), ss(37, 39, t) * (1 - ss(NOISE, NOISE + 0.6, t)) * 0.7, t);
  }
}

// ---------- per-frame world update ----------
const hallFog = new THREE.Color(0x0a0405), gardenFog = new THREE.Color(0x1a2133);
function updateWorld(t) {
  const L = lightLevel(t);
  const inGarden = t >= FALL0;
  hallLights.forEach(l => { l.intensity = 9 * L; l.color.setHex(0xe8f2ff); });
  roomFill.intensity = 6 * L; wcLight.intensity = 10 * L;
  tubeMat.color.setScalar(0.1 + 0.9 * L);
  seekGlow.position.copy(camPos).add(V(0, 0.3, 0)); seekGlow.intensity = inGarden ? 0.9 : 1.8;
  flashLight.intensity = 0; splash.visible = false;
  hall.visible = room.visible = wc.visible = !inGarden; garden.visible = inGarden;
  scene.fog.color.copy(inGarden ? gardenFog : hallFog); scene.fog.near = inGarden ? 6 : 8; scene.fog.far = inGarden ? 32 : 24;
  if (inGarden) {   // the sun light becomes moonlight over the garden
    sun.position.set(GX + 14, 22, 30); sun.target.position.set(GX, 0, 2); sun.color.setHex(0x9fb2ff); sun.intensity = 3.2; renderer.toneMappingExposure = 1.35;
    Object.assign(sun.shadow.camera, { left: -16, right: 16, top: 16, bottom: -16, near: 1, far: 80 }); sun.shadow.camera.updateProjectionMatrix();
    hemi.color.setHex(0x7a8ac0); hemi.groundColor.setHex(0x1a2410); hemi.intensity = 1.1;
  } else {
    sun.position.set(-20, 7.5, -1); sun.target.position.set(-6, 0, -3.5); sun.color.setHex(0xd04a2a); sun.intensity = 1.6;
    Object.assign(sun.shadow.camera, { left: -9, right: 9, top: 7, bottom: -7, near: 1, far: 30 }); sun.shadow.camera.updateProjectionMatrix();
    hemi.color.setHex(0xffd6c0); hemi.groundColor.setHex(0x2a1c18); hemi.intensity = 0.3; renderer.toneMappingExposure = 0.95;
  }
  updateActors(t);
  updateGoo(t);
  updateGeyser(t);
  updateEyes(t);
  updateDebris(t);
  if (inGarden) {
    const pushers = [{ x: camPos.x, z: camPos.z, r: 1.0, k: 0.6 }, { x: naga.root.position.x, z: naga.root.position.z, r: 0.5, k: 0.35 }, { x: senpai.root.position.x, z: senpai.root.position.z, r: 0.5, k: 0.35 }];
    updateGrass(t, pushers);
  }
}

// ---------- 2D overlay: Seek's eye, ink, grain, subtitles, cards ----------
const grain = [];
{
  const r = rng(9);
  for (let k = 0; k < 6; k++) {
    const c = document.createElement('canvas'); c.width = 320; c.height = 180;
    const g = c.getContext('2d'), im = g.createImageData(320, 180);
    for (let i = 0; i < im.data.length; i += 4) { const v = r() * 255 | 0; im.data[i] = im.data[i + 1] = im.data[i + 2] = v; im.data[i + 3] = 255; }
    g.putImageData(im, 0, 0); grain.push(c);
  }
}
const DRIPS = Array.from({ length: 16 }, (_, i) => { const r = rng(400 + i); return { x: r() * W, w: 6 + r() * 16, sp: 0.05 + r() * 0.12, ph: r(), max: 40 + r() * 140 }; });
const scene3d = document.createElement('canvas'); scene3d.width = W; scene3d.height = H;

function drawLids(c, t) {
  if (c <= 0.001) return;
  ctx.fillStyle = '#000';
  for (const top of [true, false]) {
    ctx.beginPath();
    const edge = c * H / 2 + 8;
    if (top) { ctx.moveTo(0, 0); for (let x = 0; x <= W; x += 32) ctx.lineTo(x, edge + Math.sin(x * 0.02 + t * 2) * 10 + (hash(x) * 14 | 0)); ctx.lineTo(W, 0); }
    else { ctx.moveTo(0, H); for (let x = 0; x <= W; x += 32) ctx.lineTo(x, H - edge - Math.sin(x * 0.017 + t * 1.7) * 10 - (hash(x + 9) * 14 | 0)); ctx.lineTo(W, H); }
    ctx.closePath(); ctx.fill();
  }
}
function drawInk(t, k = 1) {
  // Seek is ink: drips hang off the top of his eye socket
  ctx.fillStyle = '#030203';
  for (const d of DRIPS) {
    const cyc = (t * d.sp + d.ph) % 1, len = (10 + d.max * Math.sin(cyc * PI) ** 2) * k;
    ctx.fillRect(d.x - d.w / 2, 0, d.w, len);
    ctx.beginPath(); ctx.arc(d.x, len, d.w * 0.62, 0, 7); ctx.fill();
  }
  ctx.fillRect(0, 0, W, 10);
  // one-eyed vignette
  const g = ctx.createRadialGradient(W / 2, H / 2, H * 0.32, W / 2, H / 2, H * 0.95);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(0.7, 'rgba(0,0,0,.55)'); g.addColorStop(1, 'rgba(0,0,0,.95)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}
function wrap(text, maxW) {
  const words = text.split(' '), lines = []; let cur = '';
  for (const w of words) { const test = cur ? cur + ' ' + w : w; if (ctx.measureText(test).width > maxW && cur) { lines.push(cur); cur = w; } else cur = test; }
  if (cur) lines.push(cur); return lines;
}
function drawSubs(t) {
  const l = lineAt(t); if (!l) return;
  const shown = l.text.slice(0, Math.floor((t - l.s) * CPS));
  const a = ss(l.s, l.s + 0.12, t) * (1 - ss(l.e - 0.2, l.e, t));
  ctx.save(); ctx.globalAlpha = a;
  ctx.font = `30px ${FONT}`;
  const lines = wrap(l.text, 900);
  const bh = 34 + lines.length * 40, by = H - 60 - bh;
  ctx.fillStyle = 'rgba(6,4,8,.78)'; ctx.fillRect(W / 2 - 500, by, 1000, bh);
  ctx.fillStyle = SUB_COL[l.who];
  ctx.fillRect(W / 2 - 500, by, 6, bh);
  ctx.font = `20px ${FONT}`; ctx.fillText(NAMES[l.who], W / 2 - 476, by - 10);
  ctx.font = `30px ${FONT}`; ctx.fillStyle = '#efe9df';
  let left = shown;
  lines.forEach((ln, i) => { const part = left.slice(0, ln.length); left = left.slice(ln.length + 1); ctx.fillText(part, W / 2 - 476, by + 44 + i * 40); });
  ctx.restore();
}
function centerText(txt, y, size, color, alpha, spacing = 0) {
  ctx.save(); ctx.globalAlpha = alpha; ctx.font = `${size}px ${FONT}`; ctx.fillStyle = color; ctx.textAlign = 'center';
  if (spacing) ctx.letterSpacing = spacing + 'px';
  ctx.fillText(txt, W / 2, y); ctx.restore();
}
function lidAmount(t) {   // 1 = Seek's eye shut
  if (t < 2.0) return 1;
  if (t < 3.0) return 1 - ss(2.0, 3.0, t);
  if (t > PUNCH && t < PUNCH + 0.25) return Math.sin((t - PUNCH) / 0.25 * PI);
  if (t > LAND - 0.05 && t < LAND + 0.7) return Math.sin((t - LAND + 0.05) / 0.75 * PI);
  if (t > 55.6 && t < END) return 0.45 * ss(55.6, 56.6, t);     // narrowing, suspicious
  if (t >= END) return 1;
  return 0;
}
function drawCracks(t) {
  const a = ss(PUNCH, PUNCH + 0.05, t) * (1 - ss(FALL0 - 0.1, FALL0, t));
  if (a <= 0) return;
  const r = rng(99);
  ctx.save(); ctx.globalAlpha = a; ctx.strokeStyle = '#f2ece0'; ctx.lineWidth = 5;
  for (let i = 0; i < 9; i++) {
    let x = W / 2, y = H * 0.82; ctx.beginPath(); ctx.moveTo(x, y);
    const ang = -PI + (i / 8) * PI, grow = ss(PUNCH, PUNCH + 0.4, t);
    for (let j = 0; j < 6; j++) { x += Math.cos(ang + (r() - 0.5) * 0.9) * 70 * grow; y += Math.sin(ang + (r() - 0.5) * 0.9) * 50 * grow + 18; ctx.lineTo(x, y); }
    ctx.stroke();
  }
  ctx.restore();
}
function drawCards(t) {
  const ta = ss(0.2, 0.7, t) * (1 - ss(1.8, 2.6, t));
  if (ta > 0) {
    centerText('SEEK POV', H / 2 - 20, 84, '#e9e4da', ta, 8);
    centerText('PART 4 — THE GARDEN', H / 2 + 40, 30, '#7fbf6a', ta, 4);
    centerText('fan-made · Nagatoro × DOORS', H / 2 + 90, 18, '#6f6573', ta);
  }
  const ga = ss(LAND + 1.2, LAND + 1.8, t) * (1 - ss(LAND + 5, LAND + 6, t));
  if (ga > 0) { ctx.save(); ctx.globalAlpha = ga; ctx.font = `22px ${FONT}`; ctx.fillStyle = '#e8c672'; ctx.fillText('THE COURTYARD GARDEN', 64, 74); ctx.restore(); }
  const ha = ss(HIDE + 1, HIDE + 1.6, t) * (1 - ss(HIDE + 5, HIDE + 6, t));
  if (ha > 0) centerText('they are hiding somewhere...', 110, 24, '#c9c2b0', ha, 2);
  const ea = ss(END + 0.8, END + 1.6, t) * (1 - ss(DUR - 1.2, DUR - 0.2, t));
  if (ea > 0) {
    centerText('TO BE CONTINUED', H / 2 - 10, 64, '#e9e4da', ea, 6);
    centerText('NEXT — PART 5: AFTER DARK', H / 2 + 48, 26, '#8fb8ff', ea * ss(END + 2, END + 2.8, t), 3);
  }
}
function composite(t) {
  ctx.imageSmoothingEnabled = false;
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  if (t < END) {
    const ag = Math.max(impulse(t, TACKLE, 1, 2), impulse(t, PUNCH, 1.8, 1.2), impulse(t, LAND, 1, 2)) + (t > FALL0 && t < LAND ? 0.6 : 0);
    ctx.drawImage(renderer.domElement, -8, -4.5, W + 16, H + 9);
    if (ag > 0.02) {
      ctx.globalAlpha = Math.min(0.4, 0.25 * ag); ctx.globalCompositeOperation = 'lighter';
      ctx.drawImage(renderer.domElement, -8 + 6 + 10 * ag, -4.5, W + 16, H + 9);
      ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
      const r = rng(Math.floor(t * 24));
      for (let i = 0; i < 4 * ag; i++) { const y = r() * H | 0, h = 6 + r() * 30 | 0; ctx.drawImage(out, 0, y, W, h, (r() - 0.5) * 60 * ag, y, W, h); }
    }
    drawCracks(t);
    drawInk(t, 1 + impulse(t, PUNCH, 1.5, 1));
  }
  const fl = ss(PUNCH - 0.03, PUNCH, t) * (1 - ss(PUNCH + 0.05, PUNCH + 0.35, t));
  if (fl > 0) { ctx.fillStyle = `rgba(255,255,255,${fl})`; ctx.fillRect(0, 0, W, H); }
  drawLids(lidAmount(t), t);
  ctx.globalAlpha = 0.07; ctx.globalCompositeOperation = 'overlay';
  ctx.drawImage(grain[Math.floor(t * 24) % grain.length], 0, 0, W, H);
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  drawSubs(t);
  drawCards(t);
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, 34); ctx.fillRect(0, H - 34, W, 34);
}
function renderFrame(t) {
  updateCamera(t);
  updateWorld(t);
  if (t < END) renderer.render(scene, camera);
  composite(t);
}

// ---------- export / playback ----------
window.__eyes = eyes;
const STEPS = []; for (let t = 22.4; t < NOISE + 7.5; t += 1.2) if (t < 36 || t > NOISE + 1) STEPS.push(+t.toFixed(3));
window.TIMELINE = { DUR, LINES, CPS, EYES: [], STEPS, SFX, HIDE, NOISE, END, FALL0, LAND };
window.renderFrame = (t) => { renderFrame(t); return out.toDataURL('image/jpeg', 0.93); };
await document.fonts.load(`30px "DotGothic16"`).catch(() => {});
window.__ready = true;

if (!RENDER) {
  const aud = document.getElementById('aud'), playBtn = document.getElementById('play');
  const fill = document.getElementById('progFill'), timeEl = document.getElementById('time'), prog = document.getElementById('prog');
  let playing = false, t0 = 0, base = 0;
  const fmt = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
  const now = () => playing ? Math.min(DUR, base + (performance.now() - t0) / 1000) : base;
  function setPlaying(p) {
    if (p === playing) return;
    if (p) { if (base >= DUR) base = 0; t0 = performance.now(); aud.currentTime = base; aud.play().catch(() => {}); }
    else { base = now(); aud.pause(); }
    playing = p; playBtn.textContent = p ? 'Pause' : 'Play';
  }
  function seek(s) { base = clamp(s, 0, DUR); t0 = performance.now(); aud.currentTime = base; }
  playBtn.onclick = () => setPlaying(!playing);
  document.getElementById('restart').onclick = () => { seek(0); setPlaying(true); };
  prog.onclick = e => { const r = prog.getBoundingClientRect(); seek((e.clientX - r.left) / r.width * DUR); };
  prog.onkeydown = e => { if (e.key === 'ArrowRight') seek(now() + 5); if (e.key === 'ArrowLeft') seek(now() - 5); };
  (function loop() {
    const t = now();
    if (playing && t >= DUR) setPlaying(false);
    renderFrame(t);
    fill.style.width = (t / DUR * 100) + '%';
    timeEl.textContent = `${fmt(t)} / ${fmt(DUR)}`;
    requestAnimationFrame(loop);
  })();
}
