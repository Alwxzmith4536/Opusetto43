<meta name="description" content="Scripted three.js preview of the Ten Shadows Roblox project: the same part-built models, recreated effects and the in-game HUD layout. Not Roblox Studio footage.">
<style>
  :root { --ink: #0c0b12; --paper: #eeeae2; --muted: #968fae; --gold: #ffd678; --purple: #7846c8; --red: #ff6e6e; }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; color: var(--paper);
    font-family: "Segoe UI", "Hiragino Sans", "Noto Sans CJK JP", system-ui, sans-serif; }
  #stage { position: fixed; inset: 0; }
  canvas { display: block; }
  .hud { position: fixed; inset: 0; pointer-events: none; }
  #bossbar { position: absolute; left: 50%; top: 26px; width: 620px; transform: translateX(-50%); opacity: 0; transition: opacity .4s; }
  #bossbar .name { text-align: center; font-weight: 900; color: var(--gold); font-size: 15px; letter-spacing: .02em; text-shadow: 0 1px 3px #000; }
  #bossbar .bar { position: relative; height: 16px; margin-top: 4px; background: rgba(12,11,18,.9); border: 1.5px solid rgba(255,214,120,.7); border-radius: 4px; overflow: hidden; }
  #bossbar .lag { position: absolute; inset: 0; background: #ff785a; transform-origin: left; }
  #bossbar .fill { position: absolute; inset: 0; background: #f0e6d2; transform-origin: left; }
  #bossbar .hp { position: absolute; inset: 0; text-align: center; font-size: 11px; line-height: 16px; color: #0c0b12; font-weight: 700; }
  #bossbar .phase { position: absolute; right: 0; top: 0; font-size: 12px; font-weight: 800; color: var(--red); }
  #chips { display: flex; gap: 6px; justify-content: center; margin-top: 6px; flex-wrap: wrap; }
  .chip { width: 98px; height: 32px; border-radius: 6px; background: rgba(12,11,18,.85); border: 1px solid; text-align: center; font-size: 11px; font-weight: 700; line-height: 15px; padding-top: 1px; box-sizing: border-box; }
  .chip.adapted { background: rgba(70,56,20,.9); border-color: var(--gold) !important; }
  .chip .pips { color: var(--muted); font-weight: 900; }
  .chip.adapted .pips { color: var(--gold); }
  #hotbar { position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%); display: flex; gap: 5px; }
  .slot { position: relative; width: 56px; height: 62px; background: rgba(12,11,18,.85); border: 1.5px solid rgba(120,70,200,.65); border-radius: 8px; text-align: center; overflow: hidden; }
  .slot.special { border-color: rgba(255,214,120,.65); }
  .slot .k { font-weight: 900; font-size: 17px; margin-top: 6px; white-space: nowrap; }
  .slot.special .k { color: var(--gold); font-size: 12px; margin-top: 10px; }
  .slot .n { font-size: 10px; color: var(--muted); margin-top: 2px; }
  .slot .key { font-size: 11px; color: var(--gold); font-weight: 700; }
  .slot .cd { position: absolute; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,.6); height: 0; }
  .slot .lock { position: absolute; inset: 0; background: rgba(0,0,0,.7); color: var(--red); font-size: 10px; font-weight: 800; display: flex; align-items: center; justify-content: center; }
  .slot.pulse { box-shadow: 0 0 0 3px rgba(255,214,120,.9); }
  #hp { position: absolute; left: 50%; bottom: 88px; transform: translateX(-50%); width: 340px; height: 14px; border-radius: 7px; background: rgba(12,11,18,.85); overflow: hidden; border: 1px solid rgba(255,255,255,.2); }
  #hp .fill { position: absolute; inset: 0; background: #6edc8c; transform-origin: left; }
  #hp .t { position: absolute; inset: 0; text-align: center; font-size: 11px; line-height: 14px; font-weight: 700; }
  #incant { position: absolute; left: 0; right: 0; top: 30%; text-align: center; opacity: 0; }
  #incant .kanji { font-size: 64px; font-weight: 900; letter-spacing: .05em; text-shadow: 0 0 18px rgba(120,70,200,.9), 0 2px 4px #000; }
  #incant .title { font-size: 22px; font-weight: 900; color: var(--gold); letter-spacing: .06em; text-shadow: 0 2px 4px #000; margin-top: 4px; }
  #notices { position: absolute; left: 50%; top: 128px; transform: translateX(-50%); width: 760px; text-align: center; }
  #notices div { font-size: 15px; font-weight: 700; text-shadow: 0 1px 3px #000, 0 0 2px #000; margin-bottom: 3px; }
  #chant { position: absolute; left: 50%; bottom: 112px; transform: translateX(-50%); width: 300px; height: 9px; border-radius: 5px; border: 1.5px solid var(--purple); background: var(--ink); display: none; overflow: hidden; }
  #chant .fill { height: 100%; background: #be96ff; width: 0; }
  .dmg { position: absolute; font-weight: 900; font-size: 22px; transform: translate(-50%, -50%); text-shadow: 0 0 3px #000, 0 2px 3px #000; white-space: nowrap; }
  #disclaimer { position: absolute; left: 12px; bottom: 96px; max-width: 250px; font-size: 11px; color: rgba(238,234,226,.75); background: rgba(0,0,0,.45); padding: 4px 8px; border-radius: 4px; }
  #card { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; background: radial-gradient(ellipse at center, rgba(12,11,18,.55), rgba(0,0,0,.92)); opacity: 0; }
  #card h1 { margin: 0; font-size: 54px; font-weight: 900; letter-spacing: .04em; }
  #card h1 span { color: var(--gold); }
  #card p { margin: 10px 0 0; color: var(--muted); font-size: 17px; }
  #card .jp { font-size: 30px; font-weight: 900; color: #be96ff; margin-bottom: 8px; }
  #flash { position: absolute; inset: 0; background: #fff; opacity: 0; }

<div id="stage"></div>

<script type="module">
import * as THREE from "three";
import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";
import { OutputPass } from "three/addons/postprocessing/OutputPass.js";
import { buildModel } from "./parts.js";

const MODELS = await (await fetch("../assets/models.json")).json();
const W = innerWidth, H = innerHeight;

// ---------------------------------------------------------------- deterministic helpers
let seed = 1337;
const rnd = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
const rr = (a, b) => a + (b - a) * rnd();
const V = (x, y, z) => new THREE.Vector3(x, y, z);
const UP = V(0, 1, 0);
const clamp01 = (x) => Math.max(0, Math.min(1, x));
const ease = { out: (x) => 1 - (1 - x) ** 2, in: (x) => x * x, inout: (x) => x < .5 ? 2 * x * x : 1 - (-2 * x + 2) ** 2 / 2,
  back: (x) => { const c = 1.70158, c3 = c + 1; return 1 + c3 * (x - 1) ** 3 + c * (x - 1) ** 2; }, lin: (x) => x };
const col = (hex) => new THREE.Color(hex);

// ---------------------------------------------------------------- renderer / scene
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(W, H);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.getElementById("stage").appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = col(0x14111f);
scene.fog = new THREE.FogExp2(0x1a1528, 0.0065);
const camera = new THREE.PerspectiveCamera(50, W / H, 0.1, 800);
scene.add(new THREE.HemisphereLight(0xdcd8ea, 0x221c2e, 0.9));
const sun = new THREE.DirectionalLight(0xfff0e0, 2.8);
sun.position.set(-60, 90, -40);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -90, right: 90, top: 90, bottom: -90, far: 300 });
scene.add(sun);
const rim = new THREE.DirectionalLight(0x9a80ff, 0.45);
rim.position.set(50, 30, 80);
scene.add(rim);

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
composer.addPass(new UnrealBloomPass(new THREE.Vector2(W, H), 0.6, 0.45, 0.86));
composer.addPass(new OutputPass());

// ---------------------------------------------------------------- arena (mirrors Arena.luau)
const std = (c, o = {}) => new THREE.MeshStandardMaterial({ color: c, roughness: 0.85, ...o });
const glow = (c, o = {}) => new THREE.MeshBasicMaterial({ color: col(c).multiplyScalar(1.5), ...o });
function add(geo, mat, pos, rot) { const m = new THREE.Mesh(geo, mat); m.position.copy(pos); if (rot) m.rotation.set(...rot); m.receiveShadow = true; m.castShadow = true; scene.add(m); return m; }
const floor = add(new THREE.CylinderGeometry(170, 170, 4, 96), std(0x26242e), V(0, -2, 0));
floor.castShadow = false;
add(new THREE.CylinderGeometry(75, 75, 0.2, 96), std(0x3a3646, { roughness: 0.4 }), V(0, 0.05, -20)).castShadow = false;
for (let i = 0; i < 48; i++) { const a = i / 48 * Math.PI * 2;
  const m = add(new THREE.BoxGeometry(0.6, 0.1, 8.6), glow(0x7846c8), V(Math.cos(a) * 74, 0.12, -20 + Math.sin(a) * 74));
  m.rotation.y = -a; m.castShadow = false; }
for (let i = 0; i < 8; i++) { const a = i / 8 * Math.PI * 2;
  const m = add(new THREE.BoxGeometry(0.5, 0.1, 70), glow(0xd6b24a, { transparent: true, opacity: 0.55 }), V(Math.cos(a) * 37, 0.12, -20 + Math.sin(a) * 37));
  m.rotation.y = Math.PI / 2 - a; m.castShadow = false; }
add(new THREE.BoxGeometry(26, 1.2, 26), std(0x1c1a22), V(0, 0.6, -60));
const red = std(0x96202a, { roughness: 0.7 });
for (const x of [-16, 16]) add(new THREE.CylinderGeometry(1.5, 1.5, 40, 20), red, V(x, 20, -90));
add(new THREE.BoxGeometry(46, 2.4, 4), std(0x181418), V(0, 41, -90));
add(new THREE.BoxGeometry(38, 1.6, 2.4), red, V(0, 34, -90));
add(new THREE.BoxGeometry(4, 5, 0.6), std(0xd6b24a, { metalness: .7, roughness: .3 }), V(0, 37.5, -91.3));
for (let i = 0; i < 16; i++) { const a = i / 16 * Math.PI * 2, r = 158;
  add(new THREE.BoxGeometry(4, 18, 4), std(0x32303a), V(Math.cos(a) * r, 9, Math.sin(a) * r));
  add(new THREE.BoxGeometry(3, 3, 3), glow(0x966eff), V(Math.cos(a) * r, 19.5, Math.sin(a) * r)).castShadow = false; }
const lanternLights = [];
for (let i = 0; i < 4; i++) { const a = i / 4 * Math.PI * 2 + 0.4; const l = new THREE.PointLight(0x966eff, 60, 90, 1.6);
  l.position.set(Math.cos(a) * 150, 20, Math.sin(a) * 150); scene.add(l); lanternLights.push(l); }
// cursed spirits (training dummies) in the back
const dummies = [V(-40, 0, 70), V(0, 0, 90), V(40, 0, 70)].map((p) => { const m = buildModel(MODELS.CursedSpirit); m.position.copy(p); m.rotation.y = Math.atan2(p.x, p.z); scene.add(m); return m; });

// ---------------------------------------------------------------- player stand-in (blocky R6 avatar)
function makeAvatar() {
  const g = new THREE.Group();
  const uni = std(0x1b1d2c, { roughness: .7 }), skin = std(0xf1d3bc), hair = std(0x0d0c12), shoe = std(0x111111);
  const box = (s, p, m) => { const b = new THREE.Mesh(new THREE.BoxGeometry(...s), m); b.position.set(...p); b.castShadow = true; g.add(b); return b; };
  box([2, 2, 1], [0, 3, 0], uni); box([1, 2, 1], [-0.5, 1, 0], uni); box([1, 2, 1], [0.5, 1, 0], uni);
  box([1.1, .3, 1.2], [-0.5, .15, -.05], shoe); box([1.1, .3, 1.2], [0.5, .15, -.05], shoe);
  g.userData.armR = box([1, 2, 1], [1.5, 3, 0], uni); g.userData.armL = box([1, 2, 1], [-1.5, 3, 0], uni);
  box([1.2, 1.2, 1.2], [0, 4.6, 0], skin);
  box([1.3, .5, 1.3], [0, 5.3, .05], hair);
  for (let i = 0; i < 9; i++) { const s = new THREE.Mesh(new THREE.ConeGeometry(.28, 1, 4), hair);
    s.position.set(-0.5 + (i % 3) * 0.5, 5.6, -0.4 + Math.floor(i / 3) * 0.45); s.rotation.set(rr(-.5, .5), 0, rr(-.6, .6)); s.castShadow = true; g.add(s); }
  box([1.25, .12, .05], [0, 4.75, -.62], hair).scale.y = .6;
  const collar = box([2.05, .35, 1.05], [0, 3.85, 0], std(0x2a2d44));
  box([.25, .25, .06], [0.3, 3.3, -.52], std(0xd6b24a, { metalness: .8, roughness: .3 }));
  g.scale.setScalar(1.25);
  return g;
}
const player = makeAvatar();
player.position.set(0, 0, 30);
scene.add(player);
function faceTo(obj, target) { const d = target.clone().sub(obj.position); obj.rotation.y = Math.atan2(-d.x, -d.z); }

// ---------------------------------------------------------------- FX system
const fx = [];
function spawn(update, dur) { fx.push({ start: T, dur, update }); }
function tween(obj, prop, from, to, t0, dur, e = ease.out) { spawn((a) => { obj[prop].copy(from.clone().lerp(to, e(a))); }, dur); }
function matOf(color, opacity = 1, basic = true) { return basic ? new THREE.MeshBasicMaterial({ color: col(color).multiplyScalar(1.4), transparent: true, opacity, depthWrite: false })
  : new THREE.MeshStandardMaterial({ color, transparent: true, opacity }); }
function temp(mesh, dur, update) { scene.add(mesh); spawn((a) => { update?.(a); if (a >= 1) { scene.remove(mesh); } }, dur); return mesh; }
const discGeo = new THREE.CylinderGeometry(1, 1, 1, 48), sphereGeo = new THREE.SphereGeometry(1, 24, 16), boxGeo = new THREE.BoxGeometry(1, 1, 1);

function puddle(pos, r, life = 1.2) {
  const rimM = new THREE.Mesh(discGeo, matOf(0x7846c8, .75)); const d = new THREE.Mesh(discGeo, new THREE.MeshStandardMaterial({ color: 0x07060b, roughness: .15, metalness: .3 }));
  rimM.position.copy(pos).setY(.1); d.position.copy(pos).setY(.14);
  temp(rimM, life + .3, (a) => { const k = a * (life + .3) < .25 ? ease.back(a * (life + .3) / .25) : a * (life + .3) > life ? 1 - (a * (life + .3) - life) / .3 : 1; rimM.scale.set((r + .6) * k + .01, .12, (r + .6) * k + .01); });
  temp(d, life + .3, (a) => { const k = a * (life + .3) < .25 ? ease.back(a * (life + .3) / .25) : a * (life + .3) > life ? 1 - (a * (life + .3) - life) / .3 : 1; d.scale.set(r * k + .01, .12, r * k + .01); });
  smoke(pos.clone().setY(1), 0x0e0c14, 8, r * .6, 3);
}
function flash(pos, color, size, dur = .35) { const m = new THREE.Mesh(sphereGeo, matOf(color, .55)); m.material.blending = THREE.AdditiveBlending; m.position.copy(pos);
  const light = new THREE.PointLight(color, 160, size * 3, 1.5); light.position.copy(pos); scene.add(light);
  temp(m, dur, (a) => { const s = .5 + size / 2 * ease.out(a); m.scale.setScalar(s); m.material.opacity = .55 * (1 - a); light.intensity = 160 * (1 - a); if (a >= 1) scene.remove(light); }); }
function ring(pos, radius, color, dur = .5, segs = 28, h = .6) {
  for (let i = 0; i < segs; i++) { const a = i / segs * Math.PI * 2; const dir = V(Math.cos(a), 0, Math.sin(a));
    const m = new THREE.Mesh(boxGeo, matOf(color, 1)); m.rotation.y = -a + Math.PI / 2;
    temp(m, dur, (k) => { const e = ease.out(k); m.position.copy(pos).addScaledVector(dir, 1.5 + radius * e).setY(pos.y + .4); m.scale.set(.6 * (1 - e * .5), h * (1 - e * .7), radius * .18 * (1 - e * .4)); m.material.opacity = 1 - k; }); }
  const d = new THREE.Mesh(discGeo, matOf(color, .4));
  temp(d, dur, (k) => { d.position.copy(pos).setY(pos.y + .1); d.scale.set(radius * ease.out(k) + .1, .1, radius * ease.out(k) + .1); d.material.opacity = .4 * (1 - k); });
}
// sprite particles
const spriteTex = (() => { const c = document.createElement("canvas"); c.width = c.height = 64; const g = c.getContext("2d");
  const gr = g.createRadialGradient(32, 32, 0, 32, 32, 32); gr.addColorStop(0, "rgba(255,255,255,1)"); gr.addColorStop(.4, "rgba(255,255,255,.5)"); gr.addColorStop(1, "rgba(255,255,255,0)");
  g.fillStyle = gr; g.fillRect(0, 0, 64, 64); return new THREE.CanvasTexture(c); })();
function particles(pos, { color = 0xffffff, count = 20, size = 1, speed = 20, life = .5, gravity = 0, additive = true, grow = 0, spread = 1, dir = null, opacity = 1 }) {
  for (let i = 0; i < count; i++) {
    const mat = new THREE.SpriteMaterial({ map: spriteTex, color: additive ? col(color).multiplyScalar(1.5) : col(color), transparent: true, opacity, depthWrite: false, blending: additive ? THREE.AdditiveBlending : THREE.NormalBlending });
    const s = new THREE.Sprite(mat); const v = V(rr(-1, 1), rr(-1, 1) * spread, rr(-1, 1)).normalize().multiplyScalar(speed * rr(.4, 1));
    if (dir) v.lerp(dir.clone().multiplyScalar(speed * rr(.6, 1.2)), .75); const p0 = pos.clone(); const l = life * rr(.7, 1.3);
    temp(s, l, (a) => { const t = a * l; s.position.copy(p0).addScaledVector(v, t * (1 - a * .5)).add(V(0, gravity * t * t * .5, 0)); s.scale.setScalar(size * (1 + grow * a) * (additive ? 1 - a * .6 : 1)); s.material.opacity = opacity * (1 - a); });
  }
}
const smoke = (pos, color, count, size, speed) => particles(pos, { color, count, size, speed, life: .9, gravity: 5, additive: false, grow: 1.4, opacity: .75 });
const sparks = (pos, color, count = 24, speed = 40) => particles(pos, { color, count, size: .9, speed, life: .35 });
function bolt(p0, p1, color, width = .3, dur = .3) {
  const n = Math.max(4, Math.floor(p0.distanceTo(p1) / 5)); let last = p0.clone();
  for (let i = 1; i <= n; i++) { const tgt = p0.clone().lerp(p1, i / n); if (i < n) tgt.add(V(rr(-2, 2), rr(-2, 2), rr(-2, 2)));
    const len = last.distanceTo(tgt); const m = new THREE.Mesh(boxGeo, matOf(color, 1)); m.position.copy(last).lerp(tgt, .5); m.lookAt(tgt);
    temp(m, dur, (a) => { m.scale.set(width * (1 - a * .8), width * (1 - a * .8), len); m.material.opacity = 1 - a; }); last = tgt; }
}
function slashArc(center, facing, radius, color, span = 150, tilt = 0, dur = .3, thick = .5) {
  const base = new THREE.Object3D(); base.position.copy(center); base.rotation.set(0, Math.atan2(-facing.x, -facing.z), 0); base.rotateZ(tilt * Math.PI / 180); base.updateMatrixWorld();
  const n = 16;
  for (let i = 0; i <= n; i++) { const a = (-span / 2 + span * i / n) * Math.PI / 180; const mid = 1 - Math.abs(i / n - .5) * 2;
    const local = V(Math.sin(a) * radius, 0, -Math.cos(a) * radius), next = V(Math.sin(a + .1) * radius, 0, -Math.cos(a + .1) * radius);
    const p = local.clone().applyMatrix4(base.matrixWorld), q = next.clone().applyMatrix4(base.matrixWorld);
    const seg = 2 * Math.PI * radius * span / 360 / n * 1.3; const m = new THREE.Mesh(boxGeo, matOf(color, 1));
    m.position.copy(p); m.up.copy(UP.clone().applyQuaternion(base.quaternion)); m.lookAt(q); m.scale.set(thick * (.3 + mid), .15 + mid * .5, seg);
    const delay = dur * .35 * i / n; const total = dur + delay; const outward = p.clone().sub(center).normalize();
    temp(m, total, (a) => { const t = a * total; m.visible = t >= delay; const k = clamp01((t - delay) / dur); m.material.opacity = 1 - k; m.position.copy(p).addScaledVector(outward, radius * .15 * k); }); }
}
function rocks(pos, count, spread) {
  for (let i = 0; i < count; i++) { const s = rr(.6, 1.6); const m = new THREE.Mesh(boxGeo, std(0x3a3642)); m.scale.setScalar(s); m.castShadow = true;
    const out = V(rr(-1, 1), 0, rr(-1, 1)).normalize().multiplyScalar(spread * rr(.4, 1)); const peak = rr(6, 14); const r0 = V(rr(0, 6), rr(0, 6), 0);
    temp(m, .7, (a) => { m.position.copy(pos).addScaledVector(out, a).add(V(0, Math.sin(a * Math.PI) * peak, 0)); m.rotation.set(r0.x * a, r0.y * a, 0); }); }
}
function shake(i, dur) { spawn((a) => { shakeAmt = Math.max(shakeAmt, i * (1 - a)); }, dur); }
let shakeAmt = 0;
function screenFlash(color, strength, dur) { const el = document.getElementById("flash"); el.style.background = color; spawn((a) => { el.style.opacity = strength * (1 - a); }, dur); }

// models
function model(name, pos, look, scale = 1) { const m = buildModel(MODELS[name], scale); m.position.copy(pos); if (look) m.rotation.y = Math.atan2(-look.x, -look.z);
  m.traverse((o) => { if (o.isMesh) { o.material = o.material.clone(); o.material.transparent = true; } }); scene.add(m); return m; }
function height(name) { return Math.max(...MODELS[name].parts.map((p) => p.pos[1] + p.size[1] / 2)); }
function emerge(name, pos, look, { scale = 1, time = .3, puddleR } = {}) { const h = height(name) * scale; const m = model(name, pos.clone().setY(-h - .5), look, scale);
  puddle(pos, puddleR ?? Math.max(3, h * .45), 1); tween(m, "position", pos.clone().setY(-h - .5), pos.clone().setY(0), 0, time, ease.back); m.userData.h = h; return m; }
function sink(m, dur = .35) { const p = m.position.clone(); puddle(p, Math.max(3, m.userData.h * .45), dur + .1);
  spawn((a) => { m.position.copy(p).setY(-(m.userData.h + 1) * ease.in(a)); if (a >= 1) scene.remove(m); }, dur); }
function moveTo(m, to, dur, e = ease.out, arc = 0) { const from = m.position.clone(); spawn((a) => { const k = e(a); m.position.copy(from).lerp(to, k).add(V(0, Math.sin(a * Math.PI) * arc, 0)); }, dur); }
function fade(m, dur) { spawn((a) => { m.traverse((o) => { if (o.isMesh) o.material.opacity = 1 - a; }); if (a >= 1) scene.remove(m); }, dur); }
function telegraphCircle(pos, r, dur) { const o = new THREE.Mesh(discGeo, matOf(0xff3c3c, .3)); o.position.copy(pos).setY(.2); o.scale.set(r, .1, r);
  const i = new THREE.Mesh(discGeo, matOf(0xff3c3c, .5)); i.position.copy(pos).setY(.22); temp(o, dur); temp(i, dur, (a) => i.scale.set(r * a + .1, .1, r * a + .1)); }
function telegraphLine(a, b, w, dur) { const len = a.distanceTo(b); const o = new THREE.Mesh(boxGeo, matOf(0xff3c3c, .3)); o.position.copy(a).lerp(b, .5).setY(.2); o.lookAt(b.clone().setY(.2)); o.scale.set(w, .1, len);
  const i = new THREE.Mesh(boxGeo, matOf(0xff3c3c, .5)); temp(o, dur); temp(i, dur, (k) => { i.position.copy(a).lerp(b, k / 2).setY(.22); i.lookAt(b.clone().setY(.22)); i.scale.set(w, .1, len * k + .1); }); }
function telegraphCone(origin, dir, range, angle, dur) { for (let i = -4; i <= 4; i++) { const a = angle / 2 * i / 4 * Math.PI / 180; const d = dir.clone().applyAxisAngle(UP, a);
  const m = new THREE.Mesh(boxGeo, matOf(0xff3c3c, .5)); m.position.copy(origin).addScaledVector(d, range / 2).setY(.2); m.lookAt(origin.clone().addScaledVector(d, range).setY(.2)); m.scale.set(i === 0 ? 1.2 : .6, .1, range); temp(m, dur); } }

const DURATION = 50;

// ---------------------------------------------------------------- frame loop
let T = 0, evIdx = 0;
events.sort((a, b) => a.t - b.t);
const tmpV = new THREE.Vector3();
function step(t) {
  T = t;
  while (evIdx < events.length && events[evIdx].t <= T) events[evIdx++].fn();
  for (let i = timers.length - 1; i >= 0; i--) if (timers[i].at <= T) { const f = timers[i].fn; timers.splice(i, 1); f(); }
  shakeAmt = 0;
  for (let i = fx.length - 1; i >= 0; i--) { const f = fx[i]; const a = clamp01((T - f.start) / f.dur); f.update(a); if (a >= 1) fx.splice(i, 1); }
  // idle motion
  if (boss.visible && bossHP > 0) { piv.Wheel.rotation.y += 0; boss.position.y += Math.sin(T * 2) * 0.002; }
  for (const d of dummies) d.rotation.z = Math.sin(T * 2 + d.position.x) * 0.03;
  camera.position.copy(cam.pos).add(V(rr(-.5, .5) * shakeAmt, rr(-.5, .5) * shakeAmt, 0));
  camera.lookAt(cam.look);
  // HUD
  $("#bossbar").style.opacity = bossVisible ? 1 : 0;
  bossLag += (bossHP - bossLag) * .06;
  $("#bossbar .fill").style.transform = `scaleX(${bossHP / 16000})`;
  $("#bossbar .lag").style.transform = `scaleX(${Math.max(bossHP, bossLag) / 16000})`;
  $("#bossbar .hp").textContent = `${Math.round(bossHP)} / 16000`;
  $("#bossbar .phase").textContent = phase === 2 ? "PHASE 2" : "";
  $("#hp .fill").style.transform = `scaleX(${playerHP / 250})`;
  $("#hp .fill").style.background = playerHP / 250 > .35 ? "#6edc8c" : "#f05a5a";
  $("#hp .t").textContent = `${Math.round(playerHP)} / 250`;
  const ia = incantUntil - T; $("#incant").style.opacity = ia > .5 ? 1 : Math.max(0, ia / .5);
  $("#incant").style.transform = `translateY(${Math.max(0, (ia - 1.55)) * 40}px)`;
  for (const s of Object.values(slots)) { const left = s.cdEnd - T; s.el.querySelector(".cd").style.height = left > 0 ? `${left / s.cdTotal * 100}%` : "0"; }
  for (let i = dmgs.length - 1; i >= 0; i--) { const d = dmgs[i]; const a = (T - d.t0) / .9; if (a >= 1) { d.el.remove(); dmgs.splice(i, 1); continue; }
    tmpV.copy(d.pos).add(V(0, a * 5, 0)).project(camera); d.el.style.left = ((tmpV.x + 1) / 2 * W) + "px"; d.el.style.top = ((1 - tmpV.y) / 2 * H) + "px";
    d.el.style.opacity = tmpV.z < 1 ? 1 - a * a : 0; }
  composer.render();
}
window.renderAt = (t) => step(t);
window.DURATION = DURATION;
window.__ready = true;
if (!new URLSearchParams(location.search).has("manual")) {
  const t0 = performance.now(); const loop = () => { const t = (performance.now() - t0) / 1000; step(t % DURATION); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
