<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ten Shadows Model Viewer</title>
<style>
  :root { --bg: #0d0c14; --ink: #ece8df; --muted: #9a94b0; --accent: #d6b24a; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
    font-family: "Segoe UI", system-ui, sans-serif; overflow: hidden; }
  canvas { display: block; }
  #label { position: fixed; left: 20px; bottom: 18px; max-width: 70ch; }
  #label h1 { margin: 0 0 4px; font-size: 22px; letter-spacing: .02em; }
  #label p { margin: 0; color: var(--muted); font-size: 13px; }
  #pick { position: fixed; top: 12px; left: 12px; background: #1a1826; color: var(--ink);
    border: 1px solid #333048; border-radius: 6px; padding: 6px 8px; font-size: 14px; }
  body.shot #pick { display: none; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<select id="pick" aria-label="Model"></select>
<div id="label"><h1></h1><p></p></div>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { buildModel } from "./parts.js";

const params = new URLSearchParams(location.search);
if (params.has("shot")) document.body.classList.add("shot");
const models = await (await fetch("../assets/models.json")).json();

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0d0c14);
scene.fog = new THREE.Fog(0x0d0c14, 80, 220);
scene.add(new THREE.HemisphereLight(0xcfd6ff, 0x221c30, 0.9));
const sun = new THREE.DirectionalLight(0xfff1dc, 2.4);
sun.position.set(-30, 60, -40);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -40, right: 40, top: 40, bottom: -40, far: 200 });
scene.add(sun);
const rim = new THREE.DirectionalLight(0x9a70ff, 1.2);
rim.position.set(30, 20, 40);
scene.add(rim);

const floor = new THREE.Mesh(new THREE.CircleGeometry(120, 64),
  new THREE.MeshStandardMaterial({ color: 0x1b1924, roughness: 0.9 }));
floor.rotation.x = -Math.PI / 2;
floor.receiveShadow = true;
scene.add(floor);
const grid = new THREE.PolarGridHelper(60, 8, 12, 64, 0x2c2840, 0x221f31);
grid.position.y = 0.02;
scene.add(grid);

const camera = new THREE.PerspectiveCamera(35, innerWidth / innerHeight, 0.1, 500);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

let current;
function show(name) {
  if (current) scene.remove(current);
  current = buildModel(models[name]);
  scene.add(current);
  const box = new THREE.Box3().setFromObject(current);
  const size = box.getSize(new THREE.Vector3());
  const center = box.getCenter(new THREE.Vector3());
  const r = Math.max(size.x, size.y, size.z);
  const az = parseFloat(params.get("az") ?? "-35") * Math.PI / 180;
  const dist = r * 2.3 + 4;
  camera.position.set(center.x + Math.sin(az) * dist, center.y + r * 0.35, center.z - Math.cos(az) * dist);
  controls.target.copy(center);
  controls.update();
  document.querySelector("#label h1").textContent = name.replace(/([a-z])([A-Z])/g, "$1 $2");
  document.querySelector("#label p").textContent = models[name].desc + `  ·  ${models[name].parts.length} parts`;
  document.getElementById("pick").value = name;
}

const pick = document.getElementById("pick");
for (const n of Object.keys(models)) pick.add(new Option(n, n));
pick.onchange = () => show(pick.value);
show(params.get("model") || "Mahoraga");

addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
renderer.setAnimationLoop(() => {
  if (current?.userData.pivots.Wheel) current.userData.pivots.Wheel.rotation.y += 0.004;
  controls.update();
  renderer.render(scene, camera);
});
window.__ready = true;
</script>
</body>
</html>
