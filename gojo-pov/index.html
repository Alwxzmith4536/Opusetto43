<title>Six Eyes, No Ears</title>
<meta name="description" content="Wordless 3D indie short, part 1: first-person from a blindfolded sorcerer-teacher whose students' every word reaches him as an explosion.">
<style>
  /* Layout: one letterboxed 16:9 stage centred on a dark classroom-dusk ground, icon-only transport under it. No words anywhere. */
  :root {
    --ground: #0c0e16;     /* night behind the screen */
    --panel: #171a26;      /* transport surface */
    --line: #2a2f44;       /* hairlines */
    --chalk: #eef0ea;      /* icons, chalk white */
    --six: #7fd3ff;        /* Six Eyes blue, focus + progress */
    --ember: #ff9a4d;      /* explosion ember, progress tail */
    color-scheme: dark;
  }
  html, body { height: 100%; background: var(--ground); color: var(--chalk); }
  body { display: grid; place-items: center; padding-inline: 16px; padding-block: 16px; box-sizing: border-box; }
  .wrap { width: min(1200px, 100%); display: grid; gap: 12px; }
  .stage { position: relative; width: 100%; max-width: 100%; aspect-ratio: 16 / 9; background: #000; overflow: hidden; border: 1px solid var(--line); }
  .stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #start { position: absolute; inset: 0; display: grid; place-items: center; background: radial-gradient(circle at 50% 50%, rgba(127,211,255,.12), rgba(0,0,0,.82) 60%); border: 0; cursor: pointer; padding: 0; }
  #start[hidden] { display: none; }
  #start svg { width: clamp(56px, 10vw, 96px); height: auto; filter: drop-shadow(0 0 18px rgba(127,211,255,.6)); transition: transform .2s; }
  #start:hover svg { transform: scale(1.08); }
  #start:focus-visible { outline: 2px solid var(--six); outline-offset: -4px; }
  .bar { display: flex; align-items: center; gap: 10px; }
  .bar button { width: 40px; height: 40px; flex: none; display: grid; place-items: center; background: var(--panel); border: 1px solid var(--line); color: var(--chalk); cursor: pointer; padding: 0; }
  .bar button:hover { border-color: var(--six); }
  .bar button:focus-visible, .progress:focus-visible { outline: 2px solid var(--six); outline-offset: 2px; }
  .bar svg { width: 18px; height: 18px; fill: currentColor; }
  .progress { flex: 1 1 auto; min-width: 0; height: 6px; background: var(--panel); border: 1px solid var(--line); position: relative; cursor: pointer; }
  .progress i { position: absolute; inset: 0 auto 0 0; width: 0; background: linear-gradient(90deg, var(--six), var(--ember)); }
  @media (prefers-reduced-motion: reduce) { #start svg { transition: none; } }
</style>

<div class="wrap">
  <div class="stage" id="stage">
    <canvas id="gl" aria-label="First-person 3D animation: a blindfolded teacher in a sunlit classroom hears every word his students say as an explosion"></canvas>
    <canvas id="fx" aria-hidden="true"></canvas>
    <button id="start" type="button" aria-label="Play with sound">
      <svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="46" fill="none" stroke="#7fd3ff" stroke-width="3"/><path d="M40 30 L72 50 L40 70 Z" fill="#eef0ea"/></svg>
    </button>
  </div>
  <div class="bar">
    <button id="play" type="button" aria-label="Pause"><svg viewBox="0 0 20 20" id="playIcon"><rect x="4" y="3" width="4" height="14"/><rect x="12" y="3" width="4" height="14"/></svg></button>
    <button id="restart" type="button" aria-label="Restart"><svg viewBox="0 0 20 20"><path d="M10 3a7 7 0 1 1-6.6 4.7l1.9.7A5 5 0 1 0 10 5v3L5.5 4 10 0z"/></svg></button>
    <div class="progress" id="prog" role="slider" aria-label="Playback position" aria-valuemin="0" aria-valuemax="62" aria-valuenow="0" tabindex="0"><i id="fill"></i></div>
    <button id="mute" type="button" aria-label="Mute"><svg viewBox="0 0 20 20" id="muteIcon"><path d="M2 7h4l5-4v14l-5-4H2z"/><path d="M13.5 6.5a5 5 0 0 1 0 7l-1-1a3.6 3.6 0 0 0 0-5zM15.6 4.4a8 8 0 0 1 0 11.2l-1-1a6.6 6.6 0 0 0 0-9.2z"/></svg></button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
'use strict';
const DUR = 62;
const REDUCE = matchMedia('(prefers-reduced-motion: reduce)').matches;

// ---------- math helpers ----------
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const lerp = (a, b, k) => a + (b - a) * k;
const sstep = k => k * k * (3 - 2 * k);
const seg = (t, a, b) => clamp((t - a) / (b - a));
const pulse = (t, a, b) => (t >= a && t <= b) ? Math.sin(Math.PI * (t - a) / (b - a)) : 0;
function rng(seed) { let s = seed >>> 0; return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296); }
// keyframe track: [[t, [values]], ...] -> smoothstep interpolation
function samp(track, t) {
  if (t <= track[0][0]) return track[0][1].slice();
  for (let i = 0; i < track.length - 1; i++) {
    const [t0, a] = track[i], [t1, b] = track[i + 1];
    if (t <= t1) { const k = sstep((t - t0) / (t1 - t0 || 1)); return a.map((v, j) => lerp(v, b[j], k)); }
  }
  return track[track.length - 1][1].slice();
}
const yawTo = (px, pz, tx, tz) => { let y = Math.atan2(-(tx - px), -(tz - pz)); if (y < 0) y += Math.PI * 2; return y; };

// ---------- renderer ----------
const glCanvas = document.getElementById('gl');
const fxCanvas = document.getElementById('fx');
const renderer = new THREE.WebGLRenderer({ canvas: glCanvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = .92;

const scene = new THREE.Scene();
scene.background = new THREE.Color('#9fc4e6');
const camera = new THREE.PerspectiveCamera(68, 16 / 9, 0.03, 500);
camera.rotation.order = 'YXZ';
scene.add(camera);

// 3-step toon ramp for the cel look
const ramp = (() => {
  const d = new Uint8Array([90, 90, 100, 255, 175, 175, 180, 255, 255, 255, 255, 255]);
  const tx = new THREE.DataTexture(d, 3, 1, THREE.RGBAFormat);
  tx.minFilter = tx.magFilter = THREE.NearestFilter; tx.generateMipmaps = false; tx.needsUpdate = true; return tx;
})();
const matCache = {};
const toonMat = (color, extra = {}) => {
  const key = color + JSON.stringify(extra);
  return matCache[key] || (matCache[key] = new THREE.MeshToonMaterial(Object.assign({ color, gradientMap: ramp }, extra)));
};
const inkMat = new THREE.MeshBasicMaterial({ color: '#14121c', side: THREE.BackSide });
function mesh(geo, color, { outline = 0, cast = true, receive = true, parent, pos, rot, scl } = {}) {
  const m = new THREE.Mesh(geo, typeof color === 'string' ? toonMat(color) : color);
  m.castShadow = cast; m.receiveShadow = receive;
  if (pos) m.position.set(...pos);
  if (rot) m.rotation.set(...rot);
  if (scl) m.scale.set(...scl);
  if (outline) { const o = new THREE.Mesh(geo, inkMat); o.scale.setScalar(1 + outline); m.add(o); }
  if (parent) parent.add(m);
  return m;
}
const box = (w, h, d) => new THREE.BoxGeometry(w, h, d);
const cyl = (r1, r2, h, s = 16) => new THREE.CylinderGeometry(r1, r2, h, s);
const sph = (r, a = 20, b = 14) => new THREE.SphereGeometry(r, a, b);

// ---------- lights ----------
const hemi = new THREE.HemisphereLight('#dfeaff', '#6b5440', 0.55); scene.add(hemi);
const sun = new THREE.DirectionalLight('#ffe2b8', 1.35);
sun.position.set(-14, 9, 3); sun.target.position.set(0, 0, 0);
sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -9, right: 9, top: 9, bottom: -9, near: 1, far: 40 });
sun.shadow.bias = -0.0006;
scene.add(sun, sun.target);
const roomFill = new THREE.PointLight('#fff3dd', 0.45, 18, 2); roomFill.position.set(0, 2.9, 0); scene.add(roomFill);
const flashLight = new THREE.PointLight('#ffb36b', 0, 14, 2); flashLight.position.set(0, 1.6, -1.2); scene.add(flashLight);

// ---------- classroom ----------
const room = new THREE.Group(); scene.add(room);
function canvasTex(w, h, draw, repeat) {
  const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; t.anisotropy = 4;
  if (repeat) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(...repeat); }
  return t;
}
const floorTex = canvasTex(512, 512, (g, w, h) => {
  const r = rng(3);
  for (let i = 0; i < 8; i++) {
    const shade = 150 + r() * 30;
    g.fillStyle = `rgb(${shade},${shade * .72 | 0},${shade * .5 | 0})`; g.fillRect(0, i * 64, w, 64);
    g.fillStyle = 'rgba(60,35,20,.35)'; g.fillRect(0, i * 64, w, 2);
    for (let k = 0; k < 30; k++) { g.fillStyle = `rgba(90,55,30,${r() * .12})`; g.fillRect(r() * w, i * 64 + r() * 60, 40 + r() * 120, 1.5); }
    g.fillStyle = 'rgba(60,35,20,.35)'; g.fillRect((r() * w) | 0, i * 64, 2, 64);
  }
}, [4, 4]);
const floor = mesh(new THREE.PlaneGeometry(12, 12), new THREE.MeshToonMaterial({ map: floorTex, gradientMap: ramp }), { parent: room, rot: [-Math.PI / 2, 0, 0], cast: false });
mesh(new THREE.PlaneGeometry(12, 12), '#efe8da', { parent: room, pos: [0, 3.2, 0], rot: [Math.PI / 2, 0, 0], cast: false });
const wallCol = '#e9dcc4', trimCol = '#7a5a3e';
// front wall (board) z=-6, back wall z=6, right wall x=6 with door
mesh(box(12, 3.2, .2), wallCol, { parent: room, pos: [0, 1.6, -6.1] });
mesh(box(12, 3.2, .2), wallCol, { parent: room, pos: [0, 1.6, 6.1] });
mesh(box(.2, 3.2, 9.4), wallCol, { parent: room, pos: [6.1, 1.6, 1.3] });
mesh(box(.2, 3.2, 1.4), wallCol, { parent: room, pos: [6.1, 1.6, -5.3] });
mesh(box(.2, .9, 1.2), wallCol, { parent: room, pos: [6.1, 2.75, -4.0] });
// wainscot trim
for (const [x, z, w, d] of [[0, -5.98, 12, .04], [0, 5.98, 12, .04], [5.98, 0, .04, 12]]) mesh(box(w, .9, d), '#d9c6a3', { parent: room, pos: [x, .45, z], cast: false });
// sliding door
const door = new THREE.Group(); room.add(door); door.position.set(6.06, 0, -4.0);
mesh(box(.06, 2.3, 1.2), '#8b6a48', { parent: door, pos: [0, 1.15, 0], outline: .01 });
mesh(box(.07, .7, .5), '#cfe3ee', { parent: door, pos: [0, 1.6, 0], cast: false });
mesh(box(.2, .06, 1.3), trimCol, { parent: room, pos: [6.1, 2.33, -4.0] });
// hallway beyond door
mesh(new THREE.PlaneGeometry(6, 6), '#b9b2a4', { parent: room, pos: [9, 0.001, -4], rot: [-Math.PI / 2, 0, 0], cast: false });
mesh(box(6, 3.2, .2), '#d8d0c0', { parent: room, pos: [9, 1.6, -5.4] });
mesh(box(6, 3.2, .2), '#d8d0c0', { parent: room, pos: [9, 1.6, -2.6] });
mesh(box(.2, 3.2, 3), '#cfc6b4', { parent: room, pos: [11.5, 1.6, -4] });
mesh(new THREE.PlaneGeometry(6, 3), '#efe8da', { parent: room, pos: [9, 3.2, -4], rot: [Math.PI / 2, 0, 0], cast: false });

// left wall x=-6 with four windows (openings y 1.0..2.5)
const winZ = [-3.6, -1.0, 1.6, 4.2], winW = 1.9, winBot = 0.95, winTop = 2.55;
mesh(box(.2, winBot, 12), wallCol, { parent: room, pos: [-6.1, winBot / 2, 0] });
mesh(box(.2, 3.2 - winTop, 12), wallCol, { parent: room, pos: [-6.1, (3.2 + winTop) / 2, 0] });
{ const edges = [-6]; winZ.forEach(z => edges.push(z - winW / 2, z + winW / 2)); edges.push(6);
  for (let i = 0; i < edges.length; i += 2) { const a = edges[i], b = edges[i + 1]; if (b - a > .01) mesh(box(.2, winTop - winBot, b - a), wallCol, { parent: room, pos: [-6.1, (winTop + winBot) / 2, (a + b) / 2] }); } }
const glassMat = new THREE.MeshBasicMaterial({ color: '#cfe8ff', transparent: true, opacity: 0.08, depthWrite: false });
const crackTex = canvasTex(512, 512, (g, w, h) => {
  const r = rng(11); g.strokeStyle = 'rgba(255,255,255,.85)'; g.lineWidth = 2;
  for (let s = 0; s < 3; s++) {
    const cx = w * (.3 + r() * .4), cy = h * (.3 + r() * .4);
    for (let k = 0; k < 9; k++) { let x = cx, y = cy, a = k / 9 * Math.PI * 2 + r() * .4; g.beginPath(); g.moveTo(x, y);
      for (let j = 0; j < 6; j++) { a += (r() - .5) * .7; x += Math.cos(a) * 40; y += Math.sin(a) * 40; g.lineTo(x, y); } g.stroke(); }
    g.beginPath(); for (let k = 0; k < 2; k++) { g.arc(cx, cy, 30 + k * 45 + r() * 10, 0, 7); } g.stroke();
  }
});
const crackMat = new THREE.MeshBasicMaterial({ map: crackTex, transparent: true, opacity: 0, depthWrite: false });
winZ.forEach((z, i) => {
  mesh(new THREE.PlaneGeometry(winW, winTop - winBot), glassMat, { parent: room, pos: [-6.02, (winTop + winBot) / 2, z], rot: [0, Math.PI / 2, 0], cast: false, receive: false });
  if (i < 3) mesh(new THREE.PlaneGeometry(winW, winTop - winBot), crackMat, { parent: room, pos: [-6.0, (winTop + winBot) / 2, z], rot: [0, Math.PI / 2, i * 1.3], cast: false, receive: false });
  // frames
  mesh(box(.08, .06, winW), '#f4f1ea', { parent: room, pos: [-6.0, winBot, z] });
  mesh(box(.08, .06, winW), '#f4f1ea', { parent: room, pos: [-6.0, winTop, z] });
  mesh(box(.08, winTop - winBot, .05), '#f4f1ea', { parent: room, pos: [-6.0, (winTop + winBot) / 2, z] });
  mesh(box(.08, .04, winW), '#f4f1ea', { parent: room, pos: [-6.0, 1.75, z] });
  // curtain bunched at side
  mesh(cyl(.09, .14, 1.9, 10), '#cfd9c8', { parent: room, pos: [-5.9, 1.7, z + winW / 2 + .08] });
});

// chalkboard
const BW = 5.2, BH = 2.0, BX = 0, BY = 1.75, BZ = -5.97;
const boardCanvas = document.createElement('canvas'); boardCanvas.width = 1300; boardCanvas.height = 500;
const bctx = boardCanvas.getContext('2d');
const boardTex = new THREE.CanvasTexture(boardCanvas); boardTex.encoding = THREE.sRGBEncoding; boardTex.anisotropy = 8;
mesh(box(BW + .2, BH + .2, .05), trimCol, { parent: room, pos: [BX, BY, BZ - .03] });
mesh(new THREE.PlaneGeometry(BW, BH), new THREE.MeshToonMaterial({ map: boardTex, gradientMap: ramp }), { parent: room, pos: [BX, BY, BZ + .005], cast: false });
mesh(box(BW, .05, .12), trimCol, { parent: room, pos: [BX, BY - BH / 2 - .05, BZ + .06] });
for (let i = 0; i < 4; i++) mesh(cyl(.012, .012, .08, 8), ['#fff', '#f6c5c5', '#c5e2f6', '#fff'][i], { parent: room, pos: [-1.6 + i * .12, BY - BH / 2 - .01, BZ + .06], rot: [0, 0, Math.PI / 2] });
// clock above the board (hands only, no numerals)
const clock = new THREE.Group(); clock.position.set(3.4, 2.75, -5.98); room.add(clock);
mesh(cyl(.22, .22, .04, 32), '#fbfaf5', { parent: clock, rot: [Math.PI / 2, 0, 0], outline: .04 });
const hourHand = mesh(box(.02, .12, .01), '#222', { parent: clock, pos: [0, 0, .03] });
const minHand = mesh(box(.012, .18, .01), '#222', { parent: clock, pos: [0, 0, .035] });
hourHand.geometry.translate(0, .06, 0); minHand.geometry.translate(0, .09, 0);

// raised teacher platform + lectern
mesh(box(7, .12, 2.2), '#9b7754', { parent: room, pos: [0, .06, -4.9] });
const lectern = new THREE.Group(); lectern.position.set(1.4, .12, -4.0); room.add(lectern);
mesh(box(.9, .95, .5), '#a67c52', { parent: lectern, pos: [0, .48, 0], outline: .01 });
mesh(box(1.0, .05, .6), '#8a6440', { parent: lectern, pos: [0, .98, 0], rot: [-.15, 0, 0] });
mesh(box(.3, .02, .22), '#f2efe6', { parent: lectern, pos: [-.1, 1.02, 0], rot: [-.15, 0, .1] });

// ceiling lamps (swing on shocks)
const lamps = [];
for (const [x, z] of [[-2.2, -2.5], [2.2, -2.5], [-2.2, 1.8], [2.2, 1.8]]) {
  const p = new THREE.Group(); p.position.set(x, 3.2, z); room.add(p);
  mesh(cyl(.008, .008, .5, 6), '#555', { parent: p, pos: [0, -.25, 0], cast: false });
  mesh(box(.25, .08, 1.5), '#e8e8e8', { parent: p, pos: [0, -.54, 0], cast: false });
  mesh(box(.18, .03, 1.4), new THREE.MeshBasicMaterial({ color: '#fffbea' }), { parent: p, pos: [0, -.595, 0], cast: false });
  lamps.push(p);
}

// desks and chairs (3x3, front row occupied)
function desk(x, z) {
  const g = new THREE.Group(); g.position.set(x, 0, z); room.add(g);
  mesh(box(.75, .04, .5), '#c79a62', { parent: g, pos: [0, .74, -.55], outline: .015 });
  mesh(box(.7, .2, .44), '#6b6f78', { parent: g, pos: [0, .62, -.55] });
  for (const [dx, dz] of [[-.33, -.77], [.33, -.77], [-.33, -.33], [.33, -.33]]) mesh(cyl(.015, .015, .72, 6), '#5d6068', { parent: g, pos: [dx, .36, dz] });
  mesh(box(.42, .04, .4), '#c79a62', { parent: g, pos: [0, .45, .12] });
  mesh(box(.42, .35, .03), '#c79a62', { parent: g, pos: [0, .75, .33] });
  for (const [dx, dz] of [[-.18, -.05], [.18, -.05], [-.18, .3], [.18, .3]]) mesh(cyl(.013, .013, .45, 6), '#5d6068', { parent: g, pos: [dx, .225, dz] });
  return g;
}
const COLS = [-2.3, 0, 2.3];
for (const z of [-2.2, -0.2, 1.8]) for (const x of COLS) desk(x, z);
// desk props on front row
mesh(box(.28, .03, .2), '#2d4f7a', { parent: room, pos: [-2.4, .77, -2.8], rot: [0, .2, 0] });
mesh(box(.22, .02, .3), '#f5f1e6', { parent: room, pos: [0.1, .77, -2.75], rot: [0, -.1, 0] });
mesh(cyl(.04, .035, .12, 12), '#d65a5a', { parent: room, pos: [2.55, .82, -2.6] });

// ---------- outside ----------
const outside = new THREE.Group(); scene.add(outside);
const skyMat = new THREE.ShaderMaterial({ side: THREE.BackSide, depthWrite: false, uniforms: { uWarm: { value: 0 } },
  vertexShader: 'varying vec3 vP; void main(){ vP = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }',
  fragmentShader: 'varying vec3 vP; uniform float uWarm; void main(){ float h = clamp(vP.y*1.6+.15,0.,1.); vec3 lo = vec3(1.0,.86,.70); vec3 hi = vec3(.36,.60,.90); vec3 c = mix(lo,hi,h); c = mix(c, vec3(1.,.55,.3), uWarm*(1.-h)); gl_FragColor = vec4(c,1.); }' });
outside.add(new THREE.Mesh(new THREE.SphereGeometry(300, 32, 16), skyMat));
mesh(new THREE.PlaneGeometry(400, 400), '#7c9a5c', { parent: outside, pos: [-100, -5, 0], rot: [-Math.PI / 2, 0, 0], cast: false });
{ const r = rng(21);
  // schoolyard trees
  for (let i = 0; i < 14; i++) { const x = -9 - r() * 14, z = -16 + r() * 32; if (Math.abs(z + 1.6) < 4.5) continue;
    const s = 1 + r() * .8; mesh(cyl(.15 * s, .2 * s, 2 * s, 8), '#6a4a33', { parent: outside, pos: [x, -5 + s, z], cast: false });
    mesh(new THREE.ConeGeometry(1.4 * s, 4 * s, 9), r() > .5 ? '#3f6b3a' : '#4f7d40', { parent: outside, pos: [x, -5 + 3.6 * s, z], cast: false }); }
  // distant town + hills
  for (let i = 0; i < 40; i++) { const z = -60 + i * 3 + r() * 2, x = -70 - r() * 30, h = 3 + r() * 12;
    mesh(box(3 + r() * 4, h, 2 + r() * 3), ['#b8b4c6', '#a7aec2', '#c9c2b6'][i % 3], { parent: outside, pos: [x, -5 + h / 2, z], cast: false, receive: false }); }
  for (let i = 0; i < 6; i++) mesh(sph(30 + r() * 20, 16, 8), '#86a07a', { parent: outside, pos: [-150 - r() * 40, -18, -100 + i * 40], scl: [1, .5, 1], cast: false, receive: false });
  // clouds
  for (let i = 0; i < 10; i++) { const cg = new THREE.Group(); cg.position.set(-120 - r() * 60, 25 + r() * 25, -120 + i * 26); outside.add(cg);
    for (let k = 0; k < 4; k++) mesh(sph(5 + r() * 5, 12, 8), '#ffffff', { parent: cg, pos: [r() * 6, r() * 3, k * 6], cast: false, receive: false }); }
}
// the silent distant explosion
const boomFar = new THREE.Group(); boomFar.position.set(-45, -5, -1.8); outside.add(boomFar);
const fireMat = new THREE.MeshBasicMaterial({ color: '#ffb35a', transparent: true, opacity: 1, blending: THREE.AdditiveBlending, depthWrite: false });
const fireball = new THREE.Mesh(sph(1, 24, 16), fireMat); boomFar.add(fireball);
const smokeStem = mesh(cyl(1.4, 2.6, 1, 14), '#8c7e78', { parent: boomFar, cast: false, receive: false });
const smokeCap = new THREE.Group(); boomFar.add(smokeCap);
{ const r = rng(5); for (let i = 0; i < 9; i++) { const a = i / 9 * Math.PI * 2; mesh(sph(1, 14, 10), i % 2 ? '#9a8a80' : '#a99a8e', { parent: smokeCap, pos: [Math.cos(a) * .9, r() * .3, Math.sin(a) * .9], scl: [.8, .6, .8], cast: false, receive: false }); }
  mesh(sph(1.1, 16, 10), '#b3a395', { parent: smokeCap, pos: [0, .35, 0], cast: false, receive: false }); }
boomFar.visible = false;

const SKIN = '#f4d6c0', UNIFORM = '#1e2338';

}

// ---------- overlay: letterbox, vignette, grain, flash, fades ----------
const fx = fxCanvas.getContext('2d');

// ---------- audio (all synthesised) ----------
let AC = null, master, muffle, revIn, noiseBuf, roomGain, muted = false;
const live = new Set();
function track(n, end) { live.add(n); n.onended = () => live.delete(n); return n; }
function initAudio() {

  master.connect(muffle); muffle.connect(comp); comp.connect(AC.destination);

  { const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }
  const ir = AC.createBuffer(2, AC.sampleRate * 1.8, AC.sampleRate);
  for (let ch = 0; ch < 2; ch++) { const d = ir.getChannelData(ch); for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 3); }

  const rs = AC.createBufferSource(); rs.buffer = bb; rs.loop = true; roomGain = AC.createGain(); roomGain.gain.value = .12;
  const rl = AC.createBiquadFilter(); rl.type = 'lowpass'; rl.frequency.value = 500;

function outNode(pan = 0, wet = .3) { const p = AC.createStereoPanner(); p.pan.value = pan; p.connect(master); const s = AC.createGain(); s.gain.value = wet; p.connect(s); s.connect(revIn); return p; }

function sfxExplosion(size, pan, muffled) {
  const at = AC.currentTime + .005, dur = .5 + size * .7;

  const n = noise(at, dur + 1.5, .7 + Math.random() * .2);
  const lp = AC.createBiquadFilter(); lp.type = 'lowpass';

  const sg = AC.createGain(); sg.gain.setValueAtTime(0, at); sg.gain.linearRampToValueAtTime(.9 * Math.min(size, 1.8), at + .01); sg.gain.exponentialRampToValueAtTime(.001, at + .5 + size * .5);

}
function sfxStep(pan = 0, vol = .35) { const at = AC.currentTime, o = outNode(pan, .15), n = noise(at, .12, .6); const lp = AC.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 380; const g = AC.createGain(); g.gain.setValueAtTime(vol, at); g.gain.exponentialRampToValueAtTime(.001, at + .12); n.connect(lp); lp.connect(g); g.connect(o); }
function sfxDoor() { const at = AC.currentTime, o = outNode(.4, .3), n = noise(at, 1.2, .5); const bp = AC.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 2; bp.frequency.setValueAtTime(500, at); bp.frequency.linearRampToValueAtTime(900, at + 1.1); const g = AC.createGain(); g.gain.setValueAtTime(0, at); g.gain.linearRampToValueAtTime(.35, at + .1); g.gain.setValueAtTime(.35, at + 1.0); g.gain.linearRampToValueAtTime(0, at + 1.15); n.connect(bp); bp.connect(g); g.connect(o);
  const k = track(AC.createOscillator()); k.type = 'triangle'; k.frequency.value = 180; const kg = AC.createGain(); kg.gain.setValueAtTime(0, at + 1.15); kg.gain.linearRampToValueAtTime(.4, at + 1.16); kg.gain.exponentialRampToValueAtTime(.001, at + 1.35); k.connect(kg); kg.connect(o); k.start(at + 1.1); k.stop(at + 1.4); }
function sfxChalk(dur) { const at = AC.currentTime, o = outNode(0, .2), n = noise(at, dur, 1.4); const bp = AC.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 3200; bp.Q.value = 2.5; const g = AC.createGain();
  const N = Math.floor(dur * 30), curve = new Float32Array(N); for (let i = 0; i < N; i++) curve[i] = (Math.sin(i * .7) > -.3 ? .18 + Math.random() * .25 : .01) * (i % 37 > 33 ? .05 : 1);
  g.gain.setValueCurveAtTime(curve, at, dur); n.connect(bp); bp.connect(g); g.connect(o);
  for (let i = 0; i < 3; i++) { const t2 = at + .6 + i * 1.3 + Math.random() * .3, s = track(AC.createOscillator()); s.frequency.setValueAtTime(2200 + Math.random() * 600, t2); s.frequency.linearRampToValueAtTime(2600 + Math.random() * 800, t2 + .15); const sg = AC.createGain(); sg.gain.setValueAtTime(0, t2); sg.gain.linearRampToValueAtTime(.025, t2 + .03); sg.gain.linearRampToValueAtTime(0, t2 + .16); s.connect(sg); sg.connect(o); s.start(t2); s.stop(t2 + .2); } }
function sfxBird(pan = -.7) { const at = AC.currentTime, o = outNode(pan, .4); const n = 2 + (Math.random() * 3 | 0);

    const g = AC.createGain(); g.gain.setValueAtTime(0, t2); g.gain.linearRampToValueAtTime(.05, t2 + .015); g.gain.linearRampToValueAtTime(0, t2 + .1); s.connect(g); g.connect(o); s.start(t2); s.stop(t2 + .12); } }
function sfxTinnitus() { const at = AC.currentTime, o = outNode(0, 0), s = track(AC.createOscillator()); s.frequency.value = 4150; const g = AC.createGain(); g.gain.setValueAtTime(0, at); g.gain.linearRampToValueAtTime(.05, at + .3); g.gain.exponentialRampToValueAtTime(.0005, at + 8); s.connect(g); g.connect(o); s.start(at); s.stop(at + 8.2);
  muffle.frequency.cancelScheduledValues(at); muffle.frequency.setValueAtTime(320, at); muffle.frequency.setValueAtTime(320, at + 1.5); muffle.frequency.exponentialRampToValueAtTime(18000, at + 6.5); }
function sfxInfinity(dur) { const at = AC.currentTime, o = outNode(0, .5); const g = AC.createGain(); g.gain.setValueAtTime(0, at); g.gain.linearRampToValueAtTime(.06, at + 1); g.gain.setValueAtTime(.06, at + dur - 1); g.gain.linearRampToValueAtTime(0, at + dur); g.connect(o);
  [110, 164.8, 220.6, 329.2].forEach((f, i) => { const s = track(AC.createOscillator()); s.type = i % 2 ? 'triangle' : 'sine'; s.frequency.value = f; s.detune.value = (i - 1.5) * 6; const lfo = track(AC.createOscillator()); lfo.frequency.value = .3 + i * .17; const lg = AC.createGain(); lg.gain.value = 4; lfo.connect(lg); lg.connect(s.detune); s.connect(g); s.start(at); s.stop(at + dur + .1); lfo.start(at); lfo.stop(at + dur + .1); });
  const shimmer = noise(at, dur, 1); const hp = AC.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 6000; const sg = AC.createGain(); sg.gain.value = .015; shimmer.connect(hp); hp.connect(sg); sg.connect(g); }
function sfxPop() { const at = AC.currentTime, o = outNode(0, .2), s = track(AC.createOscillator()); s.frequency.setValueAtTime(700, at); s.frequency.exponentialRampToValueAtTime(90, at + .09); const g = AC.createGain(); g.gain.setValueAtTime(.4, at); g.gain.exponentialRampToValueAtTime(.001, at + .15); s.connect(g); g.connect(o); s.start(at); s.stop(at + .2); }
function sfxWhoosh() { const at = AC.currentTime, o = outNode(0, .2), n = noise(at, .6, 1); const bp = AC.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 1.2; bp.frequency.setValueAtTime(300, at); bp.frequency.exponentialRampToValueAtTime(2500, at + .5); const g = AC.createGain(); g.gain.setValueAtTime(0, at); g.gain.linearRampToValueAtTime(.15, at + .3); g.gain.linearRampToValueAtTime(0, at + .6); n.connect(bp); bp.connect(g); g.connect(o); }

const CUES = [];
const cue = (t, fn) => CUES.push({ t, fn });
[.4, .95, 1.5, 2.05, 2.6].forEach(t => cue(t, () => sfxStep(.2, .25)));
cue(3.2, sfxDoor);
[5.2, 5.75, 6.3, 6.85, 7.4, 8.0].forEach((t, i) => cue(t, () => sfxStep(0, .32)));
cue(1.5, () => sfxBird(-.8)); cue(12.5, () => sfxBird(-.9)); cue(16.5, () => sfxBird(-.6));
cue(DRAW0, () => sfxChalk(DRAW1 - DRAW0));
cue(17.8, sfxWhoosh); cue(31.6, sfxWhoosh);
for (const ev of EV) cue(ev.t, () => {
  const pan = ev.who ? clamp((ev.who.x - camera.position.x) * .2, -.8, .8) : 0;
  sfxExplosion(ev.size, pan, ev.kind === 'muffled');
  if (ev.t === BIG) { sfxTinnitus(); sfxGlass(); }
});
cue(42.8, () => sfxInfinity(8.6));
[54.3, 55.4, 56.6, 57.5].forEach((t, i) => cue(t, () => sfxBird(-.5 - i * .1)));
cue(60.3, sfxPop);
CUES.sort((a, b) => a.t - b.t);
function stopAll() { live.forEach(n => { try { n.stop(); } catch (e) {} }); live.clear(); if (muffle) { muffle.frequency.cancelScheduledValues(AC.currentTime); muffle.frequency.setValueAtTime(18000, AC.currentTime); } }

// ---------- playback ----------
const stage = document.getElementById('stage');
const startBtn = document.getElementById('start'), playBtn = document.getElementById('play'), playIcon = document.getElementById('playIcon');
const restartBtn = document.getElementById('restart'), muteBtn = document.getElementById('mute'), muteIcon = document.getElementById('muteIcon');
const prog = document.getElementById('prog'), fill = document.getElementById('fill');
let t = 0, playing = false, last = null, W = 0, H = 0;
const ICON_PAUSE = '<rect x="4" y="3" width="4" height="14"/><rect x="12" y="3" width="4" height="14"/>', ICON_PLAY = '<path d="M5 3l12 7-12 7z"/>';
const ICON_SOUND = muteIcon.innerHTML, ICON_MUTED = '<path d="M2 7h4l5-4v14l-5-4H2z"/><path d="M13 7l6 6M19 7l-6 6" stroke="currentColor" stroke-width="1.8"/>';
function setPlaying(p) {
  playing = p; playIcon.innerHTML = p ? ICON_PAUSE : ICON_PLAY; playBtn.setAttribute('aria-label', p ? 'Pause' : 'Play');
  if (AC) p ? AC.resume() : AC.suspend();
}
function seek(nt) { t = clamp(nt, 0, DUR); if (AC) stopAll(); }
function resize() {
  const r = stage.getBoundingClientRect(); W = Math.max(1, r.width); H = Math.max(1, r.height);

function frame(now) {
  const dt = last == null ? 0 : Math.min(.05, (now - last) / 1000); last = now;
  if (playing) {
    const prev = t; t += dt;
    if (AC) for (const c of CUES) if (c.t > prev && c.t <= t) c.fn();
    if (t >= DUR) { t = DUR; setPlaying(false); }

startBtn.addEventListener('click', () => { initAudio(); startBtn.hidden = true; seek(0); setPlaying(true); });
playBtn.addEventListener('click', () => { if (!AC) { initAudio(); startBtn.hidden = true; } if (t >= DUR) seek(0); setPlaying(!playing); });
restartBtn.addEventListener('click', () => { if (!AC) { initAudio(); startBtn.hidden = true; } seek(0); setPlaying(true); });
muteBtn.addEventListener('click', () => { muted = !muted; if (master) master.gain.value = muted ? 0 : .85; muteIcon.innerHTML = muted ? ICON_MUTED : ICON_SOUND; muteBtn.setAttribute('aria-label', muted ? 'Unmute' : 'Mute'); });

// first still: the class at rest, seen from the front of the room
t = 20.1; setPlaying(false);
requestAnimationFrame(frame);
})();
