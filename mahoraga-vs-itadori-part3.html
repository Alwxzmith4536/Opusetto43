// ---------- playback ----------
const total = scenes.reduce((s, x) => s + x.dur, 0);
const starts = []; scenes.reduce((s, x, i) => (starts[i] = s, s + x.dur), 0);
let time = 0, playing = true, last = null, curScene = -1;
const playBtn = document.getElementById('play');
const prog = document.getElementById('prog'), fill = document.getElementById('progFill'), timeEl = document.getElementById('time');
const chapList = document.getElementById('chapters');
const fmt = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;

scenes.forEach((s, i) => {
  const li = document.createElement('li'), b = document.createElement('button');
  b.type = 'button'; b.innerHTML = `<b>${fmt(starts[i])}</b><span></span>`; b.lastChild.textContent = s.name;
  b.addEventListener('click', () => seek(starts[i] + .001));
  li.appendChild(b); chapList.appendChild(li);
});

function seek(t) { time = clamp(t, 0, total - .001); render(); }
function sceneAt(t) { let i = scenes.length - 1; while (i > 0 && starts[i] > t) i--; return i; }

function render() {
  const i = sceneAt(time), s = scenes[i], lt = time - starts[i];
  if (i !== curScene) { curScene = i; [...chapList.querySelectorAll('button')].forEach((b, j) => b.setAttribute('aria-current', j === i)); }
  fx.shake = 0; fx.flash = 0;
  c.save(); s.draw(lt); c.restore();
  out.save(); out.fillStyle = '#000'; out.fillRect(0, 0, W, H);
  const sh = reduceMotion ? 0 : Math.min(40, fx.shake), r = rng(Math.floor(time * 60) + 1);
  out.translate((r() - .5) * sh, (r() - .5) * sh);
  out.drawImage(buf, 0, 0);
  out.restore();
  if (fx.flash > 0) { out.fillStyle = hexA(fx.flashColor, reduceMotion ? fx.flash * .3 : fx.flash); out.fillRect(0, 0, W, H); }
  fill.style.width = (time / total * 100) + '%';
  timeEl.textContent = `${fmt(time)} / ${fmt(total)}`;
}

function frame(now) {
  const dt = last == null ? 0 : Math.min(.05, (now - last) / 1000); last = now;
  if (playing) { time += dt; if (time >= total) time = 0; }
  render();
  requestAnimationFrame(frame);
}

function toggle() { playing = !playing; playBtn.textContent = playing ? 'Pause' : 'Play'; last = null; }
playBtn.addEventListener('click', toggle);
document.getElementById('restart').addEventListener('click', () => { seek(0); if (!playing) toggle(); });
prog.addEventListener('click', e => { const r = prog.getBoundingClientRect(); seek((e.clientX - r.left) / r.width * total); });
prog.addEventListener('keydown', e => { if (e.key === 'ArrowRight') seek(time + 3); if (e.key === 'ArrowLeft') seek(time - 3); });
document.addEventListener('keydown', e => { if (e.code === 'Space' && e.target.tagName !== 'BUTTON') { e.preventDefault(); toggle(); } });

// Frame-exact hook for exporting to video: renders time t and returns nothing.
window.renderAt = t => { playing = false; time = clamp(t, 0, total - .001); render(); };
window.animationLength = total;

Promise.race([Promise.allSettled(loads), new Promise(r => setTimeout(r, 2500))]).then(() => { window.animationReady = true; requestAnimationFrame(frame); });
